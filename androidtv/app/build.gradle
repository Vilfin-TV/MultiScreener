plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vilfintv.livetv'
    compileSdk 34

    defaultConfig {
        applicationId "com.vilfintv.livetv"
        minSdk 26          // Shield runs API 28+; 26 enables pure-vector adaptive icons
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Stable release key (from CI secrets) so every rebuilt APK keeps the SAME
    // signature — the user can update in place without "app not installed", and
    // it reads a little better to Play Protect than a throwaway debug key.
    // Falls back to debug signing for local builds that lack the env vars.
    def ksPath = System.getenv("TV_KEYSTORE_FILE")
    def hasReleaseKey = ksPath != null && !ksPath.isEmpty() && file(ksPath).exists()
    signingConfigs {
        release {
            if (hasReleaseKey) {
                storeFile file(ksPath)
                storePassword System.getenv("TV_KEYSTORE_PASSWORD")
                keyAlias System.getenv("TV_KEY_ALIAS")
                keyPassword System.getenv("TV_KEYSTORE_PASSWORD")
                storeType "PKCS12"
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig hasReleaseKey ? signingConfigs.release : signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Pure-WebView wrapper — no AndroidX UI libs needed; keeps the APK tiny.
}
