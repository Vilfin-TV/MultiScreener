<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Premium Radio</title>
<style>
:root{
  --bg:#071425;
  --bg2:#0a192f;
  --card:#0c1f37;
  --line:#1e3556;
  --text:#e6efff;
  --muted:#8fa7c8;
  --accent:#2d6cdf;
  --accent2:#1d4fb0;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column}
.head{padding:12px 12px 8px;border-bottom:1px solid var(--line);background:rgba(6,13,26,.75)}
.title{font-size:13px;font-weight:700;letter-spacing:.4px}
.sub{font-size:11px;color:var(--muted);margin-top:2px}
.ctrl{display:flex;gap:8px;align-items:center;padding:10px 12px;border-bottom:1px solid var(--line);background:#08162a}
.btn{height:34px;min-width:34px;border:none;border-radius:999px;background:var(--accent);color:#fff;font-size:14px;cursor:pointer}
.btn:hover{background:var(--accent2)}
.vol{flex:1;accent-color:var(--accent)}
.now{padding:8px 12px;font-size:11px;color:#9ec1ff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-bottom:1px solid var(--line)}
.list{flex:1;overflow:auto;padding:8px}
.item{width:100%;text-align:left;background:var(--card);border:1px solid var(--line);color:var(--text);border-radius:10px;padding:9px 10px;cursor:pointer;margin-bottom:7px}
.item:hover{border-color:#325b92;background:#102542}
.item.active{border-color:#3a73cf;background:#112a4d}
.name{font-size:12px;font-weight:600}
.meta{font-size:10px;color:var(--muted);margin-top:2px}
.foot{padding:8px 12px;border-top:1px solid var(--line);font-size:10px;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="title">Premium Radio</div>
    <div class="sub">Curated live audio streams</div>
  </div>

  <div class="ctrl">
    <button id="playBtn" class="btn" title="Play/Pause">▶</button>
    <input id="vol" class="vol" type="range" min="0" max="100" value="80"/>
  </div>
  <div id="now" class="now">Select a station</div>

  <div id="list" class="list"></div>
  <div class="foot">If a stream is temporarily unavailable, select another station.</div>
</div>

<audio id="audio" preload="none" crossorigin="anonymous"></audio>
<script>
const STATIONS = [
  { name: 'NPR News Now', genre: 'News', url: 'https://npr-ice.streamguys1.com/live.mp3' },
  { name: 'WQXR Classical', genre: 'Classical', url: 'https://stream.wqxr.org/wqxr.mp3' },
  { name: 'AIR Kochi FM', genre: 'Malayalam', url: 'https://air.pc.cdn.bitgravity.com/air/live/pbaudio045/chunklist.m3u8' },
  { name: '986 Malayalam Radio', genre: 'Malayalam', url: 'https://stream.zeno.fm/512rbf1e3qzuv' },
  { name: '89.4 Tamil FM', genre: 'Tamil', url: 'https://centova.aarenworld.com/proxy/894tamilfm/stream' },
  { name: 'Radio AMR Kannada', genre: 'Kannada', url: 'https://stream.zenolive.com/7g8axtgtsg0uv' }
];

const audio = document.getElementById('audio');
const list = document.getElementById('list');
const now = document.getElementById('now');
const playBtn = document.getElementById('playBtn');
const vol = document.getElementById('vol');
let idx = -1;
let isPlaying = false;

function render() {
  list.innerHTML = STATIONS.map((s, i) =>
    `<button class="item ${i===idx?'active':''}" data-i="${i}"><div class="name">${s.name}</div><div class="meta">${s.genre}</div></button>`
  ).join('');
  list.querySelectorAll('.item').forEach(el => el.addEventListener('click', () => selectStation(Number(el.dataset.i))));
}

async function selectStation(i) {
  idx = i;
  const s = STATIONS[i];
  now.textContent = `Now playing: ${s.name}`;
  audio.src = s.url;
  try {
    await audio.play();
    isPlaying = true;
    playBtn.textContent = '⏸';
  } catch {
    isPlaying = false;
    playBtn.textContent = '▶';
    now.textContent = `Unable to start: ${s.name}`;
  }
  render();
}

playBtn.addEventListener('click', async () => {
  if (idx < 0) return selectStation(0);
  if (isPlaying) {
    audio.pause();
    isPlaying = false;
    playBtn.textContent = '▶';
    return;
  }
  try {
    await audio.play();
    isPlaying = true;
    playBtn.textContent = '⏸';
  } catch {}
});

audio.addEventListener('playing', () => { isPlaying = true; playBtn.textContent = '⏸'; });
audio.addEventListener('pause', () => { isPlaying = false; playBtn.textContent = '▶'; });
audio.addEventListener('error', () => {
  isPlaying = false;
  playBtn.textContent = '▶';
  if (idx >= 0) now.textContent = `Stream unavailable: ${STATIONS[idx].name}`;
});

vol.addEventListener('input', () => { audio.volume = Number(vol.value) / 100; });
audio.volume = 0.8;
render();
</script>
</body>
</html>
