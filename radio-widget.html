<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Premium Radio</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#081426;--bg2:#0a192f;--line:#173055;--text:#e7efff;--muted:#8aa3c7;--accent:#2a63d4}
html,body{height:100%;background:linear-gradient(180deg,var(--bg2),var(--bg));color:var(--text);font-family:Inter,Segoe UI,system-ui,sans-serif;overflow:hidden}
.wrap{height:100%;display:flex;flex-direction:column}
.head{padding:11px 12px;border-bottom:1px solid var(--line);background:rgba(6,12,24,.75)}
.tt{font-size:12px;font-weight:700;letter-spacing:.5px}
.sub{font-size:10px;color:var(--muted);margin-top:2px}
.body{flex:1;min-height:0;position:relative}
.placeholder{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:20px;text-align:center;background:radial-gradient(circle at top,#10294a,#081426 65%);cursor:pointer}
.badge{font-size:11px;color:#9ec1ff;font-weight:700;letter-spacing:.4px}
.msg{font-size:11px;color:var(--muted);line-height:1.55;max-width:320px}
.open-btn{border:1px solid #24509a;background:rgba(42,99,212,.15);color:#dbe8ff;border-radius:10px;padding:8px 12px;font-size:11px;font-weight:600}
#ri-frame{width:100%;height:100%;border:none;display:none;background:#050a14}
#error{display:none;position:absolute;inset:0;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:18px;text-align:center;background:#081426}
#error p{font-size:11px;color:var(--muted);line-height:1.6;max-width:330px}
#error a{font-size:11px;color:#7fb0ff;text-decoration:none;font-weight:700}
#error a:hover{text-decoration:underline}
</style>
</head>
<body>
<div class="wrap">
  <div class="head">
    <div class="tt">Premium Radio</div>
    <div class="sub">Full station directory from radiosindia.com</div>
  </div>

  <div class="body">
    <div id="ph" class="placeholder" onclick="loadPlayer()">
      <div class="badge">ALL CHANNELS</div>
      <div class="msg">Tap to load the full premium directory with all categories from radiosindia.com.</div>
      <button class="open-btn" type="button">Load Premium Channels</button>
    </div>

    <iframe id="ri-frame"
            src=""
            data-src="https://radiosindia.com/"
            loading="lazy"
            allow="autoplay; encrypted-media"
            title="Premium Radio Channels"></iframe>

    <div id="error">
      <p>The station directory is temporarily unavailable in embedded mode. Open the full directory directly.</p>
      <a href="https://radiosindia.com/" target="_blank" rel="noopener">Open radiosindia.com</a>
    </div>
  </div>
</div>

<script>
function loadPlayer() {
  var ph = document.getElementById('ph');
  var frame = document.getElementById('ri-frame');
  if (!frame) return;
  if (!frame.src) frame.src = frame.dataset.src || 'https://radiosindia.com/';
  frame.style.display = 'block';
  if (ph) ph.style.display = 'none';
}

(function () {
  var frame = document.getElementById('ri-frame');
  var err = document.getElementById('error');
  frame.addEventListener('error', function () {
    frame.style.display = 'none';
    if (err) err.style.display = 'flex';
  });
})();
</script>
</body>
</html>
