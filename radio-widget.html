<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Radio India</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#080e1a}
#ri-frame{width:100%;height:100%;border:none;display:block}
#ri-error{display:none;height:100%;background:#080e1a;color:#e2e8f0;font-family:system-ui,sans-serif;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;padding:20px}
#ri-error.show{display:flex}
#ri-error h3{font-size:15px;font-weight:700;color:#93c5fd}
#ri-error p{font-size:12px;color:#64748b;line-height:1.6}
#ri-error a{color:#3b82f6;text-decoration:none;font-size:12px;font-weight:600}
#ri-error a:hover{text-decoration:underline}
</style>
</head>
<body>

<iframe id="ri-frame"
        src="https://www.radioindia.in/"
        allow="autoplay; encrypted-media"
        sandbox="allow-scripts allow-same-origin allow-forms allow-popups allow-popups-to-escape-sandbox"
        title="Radio India — Live Stations"
        loading="lazy"></iframe>

<div id="ri-error">
  <h3>🎙 Radio India</h3>
  <p>Direct embed is restricted by the station's server.<br>Loading via secure relay…</p>
  <a href="https://www.radioindia.in/" target="_blank" rel="noopener">Open in new tab ↗</a>
</div>

<script>
(function () {
  var DIRECT_SRC  = 'https://www.radioindia.in/';
  var PROXY_BASE  = 'https://screener-proxy.vilfintv.workers.dev';
  var PROXY_SRC   = PROXY_BASE + '/?url=' + encodeURIComponent(DIRECT_SRC);

  var frame = document.getElementById('ri-frame');
  var errBox = document.getElementById('ri-error');
  var triedProxy = false;

  function tryProxy() {
    if (triedProxy) {
      frame.style.display = 'none';
      errBox.classList.add('show');
      return;
    }
    triedProxy = true;
    frame.src = PROXY_SRC;
  }

  frame.addEventListener('error', tryProxy);

  // Detect X-Frame-Options / CSP block via load + blank check
  frame.addEventListener('load', function () {
    try {
      // If the frame loaded but has no content (blocked), contentDocument is null or cross-origin
      var doc = frame.contentDocument;
      if (!doc || (doc.body && doc.body.innerHTML === '')) {
        tryProxy();
      }
    } catch (e) {
      // Cross-origin = successfully loaded (expected for external sites)
    }
  });
})();
</script>
</body>
</html>
