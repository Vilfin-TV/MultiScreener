<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>Radio India</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#080e1a;color:#e2e8f0;font-family:system-ui,sans-serif;overflow-x:hidden}

/* ── Category tabs ── */
.cats{display:flex;gap:0;background:#050a14;border-bottom:1px solid #131d35;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.cats::-webkit-scrollbar{display:none}
.cat-btn{flex-shrink:0;padding:9px 14px;border:none;background:transparent;color:#475569;font-size:10.5px;font-weight:700;cursor:pointer;letter-spacing:.5px;border-bottom:2px solid transparent;transition:all .15s;white-space:nowrap}
.cat-btn:hover{color:#93c5fd}
.cat-btn.active{color:#60a5fa;border-bottom-color:#1d4ed8;background:rgba(29,78,216,.08)}

/* ── Widget area ── */
.widget-area{padding:10px 10px 6px;flex:1;overflow-y:auto}

/* ── Override mytuner widget colours to match dark theme ── */
.mytuner-widget{border-radius:10px!important;overflow:hidden!important;background:#0d1a30!important;border:1px solid #1e3a5f!important;margin-bottom:10px}

/* ── Category section ── */
.cat-section{display:none}
.cat-section.active{display:block}

/* ── Station grid (for individual player widgets) ── */
.station-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:360px){.station-grid{grid-template-columns:1fr}}

/* ── Branding strip ── */
.brand-strip{padding:6px 10px;background:#050a14;border-top:1px solid #0e1e36;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.brand-link{font-size:9px;color:#334155;text-decoration:none;letter-spacing:.5px}
.brand-link:hover{color:#60a5fa}
</style>
</head>

<script>
function showCat(id) {
  document.querySelectorAll('.cat-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
  const sec = document.getElementById('cat-' + id);
  if (sec) sec.classList.add('active');
  event.currentTarget.classList.add('active');

  // Re-trigger mytuner widget initialization for newly visible widgets
  if (window.mytuner_scripts) {
    const widgets = sec ? sec.querySelectorAll('.mytuner-widget[data-requires_initialization="true"]') : [];
    widgets.forEach(w => {
      if (!w.dataset.initialized) {
        w.dataset.initialized = 'true';
        // Scripts already loaded — trigger init if needed
        try {
          const scripts = window.mytuner_scripts;
          Object.keys(scripts).forEach(k => {
            if (typeof scripts[k] === 'function') scripts[k](w);
          });
        } catch(_) {}
      }
    });
  }
}
</script>
