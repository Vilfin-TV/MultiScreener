<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Console</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      min-height:100vh;
      background:#030810;
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      display:flex;align-items:center;justify-content:center;
      padding:20px;
    }
    .card{
      background:#0a1830;
      border:1px solid #162d4a;
      border-radius:18px;
      padding:36px 28px 28px;
      width:100%;max-width:420px;
    }
    .logo{
      font-size:28px;margin-bottom:10px;
    }
    .title{
      font-size:20px;font-weight:800;letter-spacing:.5px;
      color:#e2eeff;margin-bottom:4px;
    }
    .sub{
      font-size:12.5px;color:#687a94;margin-bottom:28px;
    }
    label{
      display:block;font-size:10.5px;font-weight:700;
      letter-spacing:1px;text-transform:uppercase;
      color:#8ea8c8;margin-bottom:7px;
    }
    input{
      width:100%;background:#0e1f3b;border:1px solid #162d4a;
      border-radius:10px;color:#e2eeff;font-size:14px;
      padding:12px 15px;outline:none;transition:border-color .15s;
      margin-bottom:18px;font-family:inherit;
    }
    input:focus{border-color:#3b82f6}
    input::placeholder{color:#3d5470}
    .row{display:flex;gap:12px}
    .row input{margin-bottom:0}
    .row .field{flex:1;margin-bottom:18px}
    button{
      width:100%;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:#fff;border:none;border-radius:10px;
      padding:13px;font-size:15px;font-weight:700;
      cursor:pointer;letter-spacing:.3px;
      transition:opacity .15s;font-family:inherit;
    }
    button:hover{opacity:.88}
    button:disabled{opacity:.45;cursor:not-allowed}
    .status{
      margin-top:16px;padding:12px 15px;border-radius:10px;
      font-size:13px;line-height:1.5;display:none;
    }
    .status.ok{
      background:rgba(16,185,129,.1);color:#10b981;
      border:1px solid rgba(16,185,129,.2);display:block;
    }
    .status.err{
      background:rgba(239,68,68,.1);color:#f87171;
      border:1px solid rgba(239,68,68,.2);display:block;
    }
    .divider{
      border:none;border-top:1px solid #162d4a;
      margin:28px 0 22px;
    }
    .active-section h3{
      font-size:11px;font-weight:700;letter-spacing:1px;
      text-transform:uppercase;color:#687a94;margin-bottom:14px;
    }
    .active-list{display:flex;flex-direction:column;gap:8px}
    .active-item{
      background:#0e1f3b;border:1px solid #162d4a;
      border-radius:9px;padding:10px 13px;
      display:flex;align-items:center;gap:10px;
    }
    .active-item-host{
      flex:1;font-size:12.5px;font-weight:700;color:#e2eeff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .active-item-exp{font-size:10.5px;color:#687a94;white-space:nowrap}
    .empty-note{font-size:12px;color:#3d5470;text-align:center;padding:16px 0}
  </style>
</head>
<body>
<div class="card">
  <div class="logo">🔗</div>
  <div class="title">Link Console</div>
  <div class="sub">Post an external link to the public news feed.</div>

  <label for="lnk-url">URL</label>
  <input type="url" id="lnk-url" placeholder="https://example.com/article" autocomplete="off" autocapitalize="none">

  <div class="row">
    <div class="field">
      <label for="lnk-days">Visible for (days)</label>
      <input type="number" id="lnk-days" placeholder="7" min="1" max="90" value="7">
    </div>
  </div>

  <label for="lnk-pass">Password</label>
  <input type="password" id="lnk-pass" placeholder="••••••••" autocomplete="current-password">

  <button id="lnk-btn">Post Link</button>
  <div class="status" id="lnk-status"></div>

  <hr class="divider">

  <div class="active-section">
    <h3>Active Links</h3>
    <div class="active-list" id="active-list">
      <div class="empty-note">Enter password and post a link above.</div>
    </div>
  </div>
</div>

<script>
  var WORKER = 'https://screener-proxy.vilfintv.workers.dev/api/post-link';

  document.getElementById('lnk-btn').addEventListener('click', async function() {
    var url      = document.getElementById('lnk-url').value.trim();
    var days     = parseInt(document.getElementById('lnk-days').value) || 0;
    var password = document.getElementById('lnk-pass').value;
    var btn      = this;
    var status   = document.getElementById('lnk-status');

    status.className = 'status';
    status.textContent = '';

    if (!url || !days || !password) {
      return showErr('All fields are required.');
    }
    try { new URL(url); } catch(e) { return showErr('Invalid URL — include https://'); }
    if (days < 1 || days > 90) return showErr('Days must be between 1 and 90.');

    btn.disabled    = true;
    btn.textContent = 'Posting…';

    try {
      var res  = await fetch(WORKER, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ url, days, password })
      });
      var data = await res.json();
      if (res.ok && data.ok) {
        status.className   = 'status ok';
        status.textContent = '✓ Posted. Expires ' + new Date(data.expires_at).toLocaleDateString(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
        document.getElementById('lnk-url').value  = '';
        document.getElementById('lnk-pass').value = '';
        refreshActiveList();
      } else {
        showErr(data.message || ('Server error ' + res.status));
      }
    } catch(e) {
      showErr('Network error: ' + e.message);
    }

    btn.disabled    = false;
    btn.textContent = 'Post Link';

    function showErr(msg) {
      status.className   = 'status err';
      status.textContent = msg;
    }
  });

  async function refreshActiveList() {
    var listEl = document.getElementById('active-list');
    try {
      var res  = await fetch('links.json?_=' + Date.now());
      var all  = await res.json();
      var now  = new Date();
      var active = all.filter(function(l) {
        return l && l.url && (!l.expires_at || new Date(l.expires_at) > now);
      });
      if (!active.length) {
        listEl.innerHTML = '<div class="empty-note">No active links.</div>';
        return;
      }
      listEl.innerHTML = active.map(function(l) {
        var host = '';
        try { host = new URL(l.url).hostname.replace(/^www\./, ''); } catch(e) { host = l.url; }
        var diff = l.expires_at ? Math.ceil((new Date(l.expires_at) - now) / 86400000) : '?';
        var expLabel = typeof diff === 'number' ? (diff <= 1 ? 'Expires today' : diff + 'd left') : '–';
        return '<div class="active-item">'
          + '<div class="active-item-host">' + host + '</div>'
          + '<div class="active-item-exp">⏱ ' + expLabel + '</div>'
          + '</div>';
      }).join('');
    } catch(e) {
      listEl.innerHTML = '<div class="empty-note">Could not load links.json</div>';
    }
  }

  refreshActiveList();
</script>
</body>
</html>
