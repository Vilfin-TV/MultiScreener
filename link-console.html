<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Link Console — VilfinTV</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}

    body{
      min-height:100vh;
      background:#030810;
      background-image:
        radial-gradient(ellipse 80% 50% at 50% -10%, rgba(37,99,235,.18), transparent);
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      display:flex;flex-direction:column;
      align-items:center;justify-content:flex-start;
      padding:32px 16px 48px;
    }

    /* ── Top brand strip ── */
    .brand{
      display:flex;align-items:center;gap:10px;
      margin-bottom:32px;
      opacity:.7;
    }
    .brand-dot{
      width:8px;height:8px;border-radius:50%;
      background:#3b82f6;
    }
    .brand-name{
      font-size:11px;font-weight:800;letter-spacing:2px;
      text-transform:uppercase;color:#8ea8c8;
    }

    /* ── Main card shell ── */
    .console{
      width:100%;max-width:860px;
      background:#0a1830;
      border:1px solid #162d4a;
      border-radius:20px;
      overflow:hidden;
    }

    /* ── Card header ── */
    .console-hdr{
      padding:28px 32px 24px;
      border-bottom:1px solid #162d4a;
      background:linear-gradient(135deg,rgba(37,99,235,.08),transparent);
      display:flex;align-items:center;gap:14px;
    }
    .console-icon{
      width:44px;height:44px;border-radius:12px;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      display:flex;align-items:center;justify-content:center;
      font-size:22px;flex-shrink:0;
    }
    .console-hdr-text{}
    .console-title{
      font-size:18px;font-weight:800;color:#e2eeff;letter-spacing:.3px;
    }
    .console-sub{
      font-size:12px;color:#687a94;margin-top:2px;
    }

    /* ── Two-column body ── */
    .console-body{
      display:grid;
      grid-template-columns:1fr 1fr;
    }

    /* ── Form panel ── */
    .form-panel{
      padding:28px 32px;
      border-right:1px solid #162d4a;
    }

    label{
      display:block;font-size:10px;font-weight:700;
      letter-spacing:1.2px;text-transform:uppercase;
      color:#8ea8c8;margin-bottom:7px;
    }
    input{
      width:100%;
      background:#0e1f3b;
      border:1px solid #1e3a5c;
      border-radius:10px;color:#e2eeff;
      font-size:14px;padding:12px 14px;
      outline:none;transition:border-color .15s,box-shadow .15s;
      margin-bottom:20px;font-family:inherit;
    }
    input:focus{
      border-color:#3b82f6;
      box-shadow:0 0 0 3px rgba(59,130,246,.12);
    }
    input::placeholder{color:#2d4a6a}
    input[type="number"]{-moz-appearance:textfield}
    input[type="number"]::-webkit-outer-spin-button,
    input[type="number"]::-webkit-inner-spin-button{-webkit-appearance:none}

    .btn{
      width:100%;
      background:linear-gradient(135deg,#2563eb,#3b82f6);
      color:#fff;border:none;border-radius:10px;
      padding:13px;font-size:14px;font-weight:700;
      cursor:pointer;letter-spacing:.3px;
      transition:opacity .15s,transform .1s;
      font-family:inherit;
    }
    .btn:hover{opacity:.9;transform:translateY(-1px)}
    .btn:active{transform:translateY(0)}
    .btn:disabled{opacity:.4;cursor:not-allowed;transform:none}

    .status{
      margin-top:14px;padding:11px 14px;border-radius:9px;
      font-size:12.5px;line-height:1.5;display:none;
    }
    .status.ok{
      background:rgba(16,185,129,.1);color:#34d399;
      border:1px solid rgba(16,185,129,.2);display:block;
    }
    .status.err{
      background:rgba(239,68,68,.1);color:#f87171;
      border:1px solid rgba(239,68,68,.2);display:block;
    }

    /* ── Active links panel ── */
    .links-panel{
      padding:28px 32px;
      display:flex;flex-direction:column;
    }
    .links-panel-title{
      font-size:10px;font-weight:700;letter-spacing:1.2px;
      text-transform:uppercase;color:#8ea8c8;margin-bottom:16px;
    }
    .links-list{
      display:flex;flex-direction:column;gap:9px;
      flex:1;
    }
    .link-item{
      background:#0e1f3b;border:1px solid #1e3a5c;
      border-radius:10px;padding:11px 14px;
      display:flex;align-items:center;gap:10px;
      transition:border-color .15s;
    }
    .link-item:hover{border-color:#3b82f6}
    .link-item-favicon{
      width:28px;height:28px;border-radius:6px;
      background:#162d4a;display:flex;align-items:center;
      justify-content:center;font-size:13px;overflow:hidden;flex-shrink:0;
    }
    .link-item-favicon img{width:100%;height:100%;object-fit:cover;border-radius:6px}
    .link-item-body{flex:1;min-width:0}
    .link-item-host{
      font-size:12.5px;font-weight:700;color:#e2eeff;
      white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    }
    .link-item-exp{
      font-size:10px;color:#687a94;margin-top:2px;
    }
    .link-item-dot{
      width:7px;height:7px;border-radius:50%;
      background:#10b981;flex-shrink:0;
    }
    .link-item-dot.expiring{background:#f59e0b}
    .empty-note{
      font-size:12px;color:#2d4a6a;
      text-align:center;padding:24px 0;
      border:1px dashed #162d4a;border-radius:10px;
    }

    /* ── Refresh button ── */
    .refresh-btn{
      margin-top:14px;background:none;border:1px solid #162d4a;
      border-radius:8px;color:#687a94;padding:7px 14px;
      font-size:11px;cursor:pointer;transition:all .15s;
      font-family:inherit;width:100%;
    }
    .refresh-btn:hover{border-color:#3b82f6;color:#e2eeff}

    /* ── Mobile: single column ── */
    @media(max-width:640px){
      body{padding:20px 12px 40px}
      .brand{margin-bottom:20px}
      .console-hdr{padding:20px 20px 18px}
      .console-body{grid-template-columns:1fr}
      .form-panel{padding:22px 20px;border-right:none;border-bottom:1px solid #162d4a}
      .links-panel{padding:22px 20px}
    }
  </style>
</head>
<body>

<div class="brand">
  <div class="brand-dot"></div>
  <span class="brand-name">VilfinTV &nbsp;·&nbsp; Admin</span>
  <div class="brand-dot"></div>
</div>

<div class="console">

  <!-- Header -->
  <div class="console-hdr">
    <div class="console-icon">🔗</div>
    <div class="console-hdr-text">
      <div class="console-title">Link Console</div>
      <div class="console-sub">Post an external link to the public news feed.</div>
    </div>
  </div>

  <!-- Body: Form | Active Links -->
  <div class="console-body">

    <!-- Form -->
    <div class="form-panel">
      <label for="lnk-url">URL</label>
      <input type="url" id="lnk-url" placeholder="https://example.com/article"
             autocomplete="off" autocapitalize="none" spellcheck="false">

      <label for="lnk-days">Visible for (days)</label>
      <input type="number" id="lnk-days" placeholder="7" min="1" max="90" value="7">

      <label for="lnk-pass">Password</label>
      <input type="password" id="lnk-pass" placeholder="••••••••">

      <button class="btn" id="lnk-btn">Post Link</button>
      <div class="status" id="lnk-status"></div>
    </div>

    <!-- Active Links -->
    <div class="links-panel">
      <div class="links-panel-title">Active Links</div>
      <div class="links-list" id="links-list">
        <div class="empty-note">Loading…</div>
      </div>
      <button class="refresh-btn" id="refresh-btn" onclick="refreshList()">↻ Refresh</button>
    </div>

  </div><!-- /console-body -->
</div><!-- /console -->

<script>
  var WORKER = 'https://screener-proxy.vilfintv.workers.dev/api/post-link';
  var LINKS_URL = 'https://vilfintv.com/links.json';

  // ── Submit ──────────────────────────────────────────────────────────────
  document.getElementById('lnk-btn').addEventListener('click', async function() {
    var url      = document.getElementById('lnk-url').value.trim();
    var days     = parseInt(document.getElementById('lnk-days').value) || 0;
    var password = document.getElementById('lnk-pass').value;
    var btn      = this;
    var status   = document.getElementById('lnk-status');

    status.className = 'status';
    status.textContent = '';

    if (!url)      return setErr('URL is required.');
    if (!password) return setErr('Password is required.');
    try { new URL(url); } catch(e) { return setErr('Invalid URL — must include https://'); }
    if (days < 1 || days > 90) return setErr('Days must be between 1 and 90.');

    btn.disabled    = true;
    btn.textContent = 'Posting…';

    try {
      var res  = await fetch(WORKER, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ url, days, password }),
      });
      var data = await res.json();

      if (res.ok && data.ok) {
        status.className   = 'status ok';
        status.textContent = '✓ Posted — expires ' +
          new Date(data.expires_at).toLocaleDateString(undefined,
            { month: 'short', day: 'numeric', year: 'numeric' });
        document.getElementById('lnk-url').value  = '';
        document.getElementById('lnk-pass').value = '';
        setTimeout(refreshList, 1500);
      } else {
        setErr(data.message || ('Server error ' + res.status));
      }
    } catch(e) {
      setErr('Network error: ' + e.message);
    }

    btn.disabled    = false;
    btn.textContent = 'Post Link';

    function setErr(msg) {
      status.className   = 'status err';
      status.textContent = msg;
    }
  });

  // ── Active links list ────────────────────────────────────────────────────
  async function refreshList() {
    var listEl = document.getElementById('links-list');
    listEl.innerHTML = '<div class="empty-note">Loading…</div>';
    var now = new Date();
    try {
      var res  = await fetch(LINKS_URL + '?_=' + Date.now());
      if (!res.ok) throw new Error('HTTP ' + res.status);
      var all  = await res.json();
      if (!Array.isArray(all)) throw new Error('Unexpected format');

      var active = all.filter(function(l) {
        return l && l.url && (!l.expires_at || new Date(l.expires_at) > now);
      });

      if (!active.length) {
        listEl.innerHTML = '<div class="empty-note">No active links yet.</div>';
        return;
      }

      listEl.innerHTML = '';
      active.forEach(function(l) {
        var host = '';
        try { host = new URL(l.url).hostname.replace(/^www\./, ''); } catch(e) { host = l.url; }
        var daysLeft = l.expires_at
          ? Math.ceil((new Date(l.expires_at) - now) / 86400000)
          : null;
        var expLabel = daysLeft === null ? '–' : daysLeft <= 1 ? 'Expires today' : daysLeft + 'd left';
        var dotClass = daysLeft !== null && daysLeft <= 2 ? 'link-item-dot expiring' : 'link-item-dot';
        var favicon  = 'https://www.google.com/s2/favicons?domain=' + encodeURIComponent(host) + '&sz=32';

        var item = document.createElement('div');
        item.className = 'link-item';
        item.innerHTML =
          '<div class="link-item-favicon"><img src="' + favicon + '" alt="" onerror="this.parentNode.innerHTML=\'🔗\'"></div>'
          + '<div class="link-item-body">'
            + '<div class="link-item-host">' + host + '</div>'
            + '<div class="link-item-exp">⏱ ' + expLabel + '</div>'
          + '</div>'
          + '<div class="' + dotClass + '"></div>';
        listEl.appendChild(item);
      });
    } catch(e) {
      listEl.innerHTML = '<div class="empty-note">Could not load links.json<br><small style="opacity:.6">' + e.message + '</small></div>';
    }
  }

  refreshList();
</script>
</body>
</html>
