# Cloudflare Worker config for the JKK/UR digest cron backup trigger.
#
# GitHub Actions cron is best-effort and can skip runs; Cloudflare crons fire
# reliably. This worker is the PRIMARY trigger to guarantee exact delivery times.
#
# exact JST time.
#
# Manual deploy: `npx wrangler deploy --config wrangler.jkkcron.toml`
# Secret (one-time): `npx wrangler secret put GH_TOKEN --config wrangler.jkkcron.toml`
#   GH_TOKEN — GitHub token with repo + workflow scopes.

name = "jkk-cron-trigger"
main = "jkk_cron_worker.js"
compatibility_date = "2026-01-01"

[triggers]
# UTC. JST = UTC+9. Nominal slots:
# JKK: 00:35 / 02:03 / 05:30 / 09:20 UTC
# We now fire exactly on time to guarantee immediate dispatch.
crons = ["35 0 * * *", "3 2 * * *", "30 5 * * *", "20 9 * * *"]
