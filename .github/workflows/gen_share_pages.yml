name: Generate Story Share Pages

# Regenerates share/<id>.html for every story in content.json whenever it
# changes (published/edited/deleted via the console, an agent key, a cron
# job, or a direct commit) - these static pages carry each story's own
# Open Graph / Twitter Card tags so links pasted into Facebook/X/WhatsApp/
# Telegram unfurl with that story's real headline and hero photo instead of
# the site's generic default (news.html is client-rendered, so link-preview
# crawlers never see per-story content there).

on:
  push:
    branches: [main]
    paths:
      - 'content.json'
      - 'scripts/gen_share_pages.py'
      - '.github/workflows/gen_share_pages.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Generate share pages
        run: python3 scripts/gen_share_pages.py

      - name: Commit if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          git add share/
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "chore(share): regenerate story share pages [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
