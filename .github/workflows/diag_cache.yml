name: Diagnose Cloudflare cache config

# Read-only: lists the vilfintv.com zone's Page Rules, cache Rulesets, and the
# response headers, so we can see exactly what is caching iptv.html.

on:
  workflow_dispatch: {}

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set -uo pipefail
          ZID=$(curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones?name=vilfintv.com" | python3 -c "import sys,json;print(json.load(sys.stdin)['result'][0]['id'])")
          echo "zone: $ZID"
          echo "===== PAGE RULES ====="
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZID/pagerules" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('success:',d.get('success'),'errors:',d.get('errors'));[print('-',[t.get('value') for t in r.get('targets',[])],'=>',[(a.get('id'),a.get('value')) for a in r.get('actions',[])],'status:',r.get('status')) for r in (d.get('result') or [])] or print('(no page rules / no read perm)')"
          echo "===== CACHE RULESETS (http_request_cache_settings) ====="
          curl -s -H "Authorization: Bearer $TOKEN" "https://api.cloudflare.com/client/v4/zones/$ZID/rulesets" \
            | python3 -c "import sys,json;d=json.load(sys.stdin);print('success:',d.get('success'),'errors:',d.get('errors'));[print('-',r.get('phase'),r.get('name'),r.get('id')) for r in (d.get('result') or []) if 'cache' in (r.get('phase') or '')] or print('(none / no read perm)')"
          echo "===== response headers for iptv.html ====="
          curl -sI "https://vilfintv.com/iptv.html?cb=$RANDOM" | grep -iE "cf-cache-status|age|cache-control|via|x-cache|x-served|expires|last-modified|cf-ray" || true
