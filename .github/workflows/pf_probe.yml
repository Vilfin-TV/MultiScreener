name: Portfolio source probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: |
          i=0
          for a in "Sundaram" "Union" "quant" "Canara Robeco" "Mahindra Manulife" "Bank of India" "Bajaj Finserv" "ITI"; do
            i=$((i+1)); echo "== $a" >> .probe/pf_probe_b.log
            timeout 300 xvfb-run -a python .probe/pf_probe.py "$a" "b$i" >> .probe/pf_probe_b.log 2>&1 || echo "   timed out / failed: $a" >> .probe/pf_probe_b.log
          done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): portfolio probe b [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*5)); done
