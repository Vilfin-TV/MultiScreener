name: Portfolio source probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_probe.yml, .probe/pf_probe.py]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: a, amcs: "Kotak Mahindra,Axis,Bandhan,UTI,Edelweiss,Motilal Oswal,Franklin Templeton,LIC"}
          - {tag: b, amcs: "Sundaram,Union,quant,Canara Robeco,Mahindra Manulife,Bank of India,Bajaj Finserv,ITI"}
          - {tag: c, amcs: "WhiteOak Capital,Jio BlackRock,Zerodha,Navi,Quantum,The Wealth Company,Taurus,NJ"}
          - {tag: d, amcs: "Angel One,AlphaGrep,Choice,Unifi,ASK,Lakshya,Monarch"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: xvfb-run -a python .probe/pf_probe.py "${{ matrix.amcs }}" ${{ matrix.tag }} > .probe/pf_probe_${{ matrix.tag }}.log 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe/pf_probe_${{ matrix.tag }}.* && git commit -m "chore(dev): portfolio probe ${{ matrix.tag }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase && git push && break; sleep $((i*5)); done
