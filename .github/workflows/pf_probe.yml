name: Portfolio source probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_probe.yml, .probe/trigger]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scripts/build_mf_holdings.py "--only=Shriram,HSBC,Sundaram,The Wealth Company,Edelweiss" --force > .probe/holdings.log 2>&1 || true
      - run: cp .mfcache/holdings/report.json .probe/holdings_report.json || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe data/mf/p && git commit -m "chore(dev): portfolio probe 3 [skip ci]" && git pull --rebase && git push
