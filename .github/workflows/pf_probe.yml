name: Portfolio source probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_probe.yml, .probe/pf_probe2.py]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Holdings for new fund houses
        run: xvfb-run -a python scripts/build_mf_holdings.py "--only=Abakkus,Capitalmind,Old Bridge,JM Financial,Shriram,Trust,Samco,Helios,Baroda BNP Paribas,Zerodha,360 ONE,Unifi,LIC" --force > .probe/holdings.log 2>&1 || true
      - run: cp .mfcache/report.json .probe/holdings_report.json || true
      - name: Probe larger fund houses
        run: xvfb-run -a python .probe/pf_probe2.py > .probe/pf_probe2.log 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe data/mf/p && git commit -m "chore(dev): portfolio probe 2 [skip ci]" && git pull --rebase && git push
