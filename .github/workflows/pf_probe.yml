name: Portfolio source probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_probe.yml, .probe/trigger]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: xvfb-run -a python scripts/build_mf_holdings.py "--only=Trust,PGIM India,Edelweiss,Zerodha,Baroda BNP Paribas,Axis" --force > .probe/holdings.log 2>&1 || true
      - run: python scripts/audit_mf_holdings.py > .probe/audit.log 2>&1 || true
      - run: node scripts/verify_mf_screener.js --holdings > .probe/verify.log 2>&1 || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe data/mf/p && git commit -m "chore(dev): fund page readers test [skip ci]" && (git pull --rebase || (git rebase --abort; git pull --no-rebase -X ours --no-edit)) && git push
