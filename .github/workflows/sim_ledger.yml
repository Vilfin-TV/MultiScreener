name: Simulator Buy Ledger

# Simulator Buy: model-portfolio tracking accounts of VilfinTV agents (scripts/sim_config.json).
# The ledger lives ONLY in the private R2 bucket "vilfintv-sim" — never in this public repository.
#   1. find a trusted ledger copy (scripts/sim_restore.py): main copy → backup bucket → dated copies → encrypted off-site
#      copy; a copy is trusted only if its hash chain verifies and it continues the published head. Never starts over.
#   2. scripts/sim_engine.py: plan snapshot, new orders, allotments / fills at official NAVs and closes, reviews, valuation
#   3. scripts/audit_sim.py: independent audit — any error stops here and nothing is published
#   4. upload ledger / view / audit + a dated permanent copy to R2, a copy to the backup bucket and (when the
#      SIM_BACKUP_KEY secret is set) an encrypted off-site copy as a workflow artifact
#   5. commit only the public marker (event count + head hash) and the return-% scoreboard
# Outages (GitHub, Cloudflare, data sources): any later run catches up every missed date at that date's own prices —
# a run every 3 hours makes sure that happens soon after the service is back.
on:
  workflow_run:
    workflows: ["India MF Screener Data", "ETF Momentum Mode Data"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'scripts/sim_engine.py'
      - 'scripts/sim_config.json'
      - 'scripts/audit_sim.py'
      - 'scripts/sim_restore.py'
      - 'scripts/sim_xirr.js'
      - 'scripts/dip_rules.py'
      - '.github/workflows/sim_ledger.yml'
  schedule:
    - cron: '25 16 * * *'        # 21:55 IST daily fallback
    - cron: '7 */3 * * *'        # safety run every 3 hours: catches up after any outage (runs are idempotent)
  workflow_dispatch:

permissions:
  contents: write
  actions: read                  # list / download the encrypted off-site copies of earlier runs

concurrency:
  group: sim-ledger
  cancel-in-progress: false

jobs:
  ledger:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install tools
        run: |
          pip install -q requests
          npm install -g wrangler@3

      - name: Find a trusted ledger copy (main → backup → dated → off-site)
        env:
          GH_TOKEN: ${{ github.token }}
          SIM_BACKUP_KEY: ${{ secrets.SIM_BACKUP_KEY }}
        run: |
          mkdir -p "$RUNNER_TEMP/sim"
          python scripts/sim_restore.py --out "$RUNNER_TEMP/sim/ledger.json"

      - name: Check the ledger continues the published one
        run: |
          python - <<'EOF'
          import json, os, sys
          p = os.path.join(os.environ["RUNNER_TEMP"], "sim", "ledger.json")
          meta = json.load(open("data/sim_meta.json")) if os.path.exists("data/sim_meta.json") else {}
          n = meta.get("events", 0)
          if not n:
              sys.exit(0)
          evs = json.load(open(p)).get("events", [])
          if len(evs) < n or evs[n - 1]["h"] != meta["head"]:
              print(f"::error::Downloaded ledger ({len(evs)} entries) does not contain the published head {meta['head'][:12]} at entry {n}")
              sys.exit(1)
          print(f"ledger continues the published head ({n} entries)")
          EOF

      - name: Verify market data availability before new orders
        run: |
          python - <<'PY'
          import json, sys
          from datetime import date, datetime
          from pathlib import Path
          # Do not substitute invented prices or assume stale subscription
          # statuses mean purchases are open. A failed upstream download must
          # stop publication; the trusted private ledger is retained for retry.
          for filename, label in [('data/mf/screener.json', 'Mutual fund purchase status'),
                                  ('data/etf_momentum.json', 'ETF market prices')]:
              p = Path(filename)
              if not p.exists():
                  sys.exit(f'::error::{label} source missing: {filename}; no orders published')
              try:
                  data = json.loads(p.read_text())
                  if filename.endswith('screener.json'):
                      assert data.get('rows') and 'buy' in data.get('cols', [])
                      d = date.fromisoformat(data['asOf'][:10])
                      cols = data['cols']
                      sub_idx, buy_idx = cols.index('sub'), cols.index('buy')
                      gold = [r for r in data['rows'] if r[sub_idx] == 'gold']
                      if not gold or any(r[buy_idx] != '' for r in gold):
                          sys.exit('::error::Gold FoF purchase-status safeguard not reflected in the downloaded screener data; rebuild MF data before simulator orders')
                  else:
                      etfs = data['etfs']
                      assert etfs
                      d = max(date.fromisoformat(e['d'][:10]) for e in etfs if e.get('d'))
                  age = (date.today() - d).days
                  if age < 0 or age > 5:
                      sys.exit(f'::error::{label} stale or future-dated ({d}, age {age} days); retry after source recovery')
                  print(f'{label}: {d} ({age} calendar days old)')
              except Exception as exc:
                  sys.exit(f'::error::{label} invalid: {exc}; no orders published')
          PY

      - name: Run the simulator engine
        run: python scripts/sim_engine.py --store "$RUNNER_TEMP/sim/ledger.json" --view "$RUNNER_TEMP/sim/view.json"

      - name: Independent audit
        id: audit
        run: |
          python scripts/audit_sim.py --store "$RUNNER_TEMP/sim/ledger.json" --view "$RUNNER_TEMP/sim/view.json" --out "$RUNNER_TEMP/sim/audit.json"

      - name: Upload the audit result even when it fails
        if: failure() && steps.audit.outcome == 'failure'
        run: wrangler r2 object put vilfintv-sim/sim/audit.json --file "$RUNNER_TEMP/sim/audit.json" --content-type application/json || true

      - name: Store ledger, statements and audit (private) + dated copy + backup bucket
        run: |
          d=$(TZ=Asia/Kolkata date +%F)
          out=$(wrangler r2 bucket create vilfintv-sim-backup 2>&1) || echo "$out" | grep -qi "already exists\|10004" || echo "::warning::backup bucket: $out"
          for f in ledger view audit; do
            wrangler r2 object put "vilfintv-sim/sim/snapshots/$d/$f.json" --file "$RUNNER_TEMP/sim/$f.json" --content-type application/json
          done
          wrangler r2 object put "vilfintv-sim-backup/sim/ledger.json" --file "$RUNNER_TEMP/sim/ledger.json" --content-type application/json \
            || echo "::warning::backup bucket copy failed (the dated copy and the main copy still hold the ledger)"
          for f in ledger view audit; do
            wrangler r2 object put "vilfintv-sim/sim/$f.json" --file "$RUNNER_TEMP/sim/$f.json" --content-type application/json
          done

      - name: Encrypted off-site copy (only when the SIM_BACKUP_KEY secret is set)
        id: enc
        env:
          SIM_BACKUP_KEY: ${{ secrets.SIM_BACKUP_KEY }}
        run: |
          if [ -z "$SIM_BACKUP_KEY" ]; then echo "SIM_BACKUP_KEY not set — off-site copy skipped"; exit 0; fi
          mkdir -p "$RUNNER_TEMP/offsite"
          openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:SIM_BACKUP_KEY \
            -in "$RUNNER_TEMP/sim/ledger.json" -out "$RUNNER_TEMP/offsite/ledger.json.enc"
          echo "made=1" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        if: steps.enc.outputs.made == '1'
        with:
          name: sim-ledger-backup
          path: ${{ runner.temp }}/offsite/ledger.json.enc
          retention-days: 30

      - name: Public marker + scoreboard (return % only)
        run: |
          python - <<'EOF'
          import json, os, sys
          sys.path.insert(0, "scripts")
          from sim_engine import scoreboard, account_files
          t = os.path.join(os.environ["RUNNER_TEMP"], "sim")
          store, view, audit = (json.load(open(os.path.join(t, f + ".json"))) for f in ("ledger", "view", "audit"))
          evs = store.get("events", [])
          days = store.get("days", [])
          json.dump({"v": 1, "events": len(evs), "head": evs[-1]["h"] if evs else None, "start": view["start"],
                     "days": len(days), "daysHead": days[-1]["h"] if days else None},
                    open("data/sim_meta.json", "w"), indent=1)
          ok = audit["nErrors"] == 0
          sb = scoreboard(view, ok)
          os.makedirs("data/sim", exist_ok=True)
          if ok:                                  # per-person files (daily summaries) only from an audited ledger
              files = account_files(store, view, sb)
              for f in os.listdir("data/sim"):
                  if f.endswith(".json") and f[:-5] not in files:
                      os.remove(os.path.join("data/sim", f))
              for f, body in files.items():
                  json.dump(body, open(f"data/sim/{f}.json", "w"), separators=(",", ":"), ensure_ascii=False)
          json.dump(sb, open("data/sim_scoreboard.json", "w"), separators=(",", ":"), ensure_ascii=False)
          print(f"scoreboard: {len(sb['rows'])} rows · ledger {len(evs)} entries · daily journal {len(days)} records")
          EOF
          bash scripts/push_data.sh "chore(data): Simulator Buy scoreboard" data/sim_meta.json data/sim_scoreboard.json data/sim
