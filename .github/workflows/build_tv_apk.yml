name: Build VilfinTV Android TV APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'androidtv/**'
      - '.github/workflows/build_tv_apk.yml'

jobs:
  build-apk:
    name: Assemble sideload APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (pinned 8.7)
        working-directory: androidtv
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK
        working-directory: androidtv
        run: ./gradlew :app:assembleRelease --no-daemon --stacktrace

      - name: Rename APK
        working-directory: androidtv
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk out/VilfinTV-LiveTV.apk
          ls -la out

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: VilfinTV-LiveTV-apk
          path: androidtv/out/VilfinTV-LiveTV.apk
          if-no-files-found: error
