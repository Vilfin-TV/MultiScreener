name: Global macro probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/gm_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: |
          mkdir -p .probe
          python3 - <<'PY' > .probe/gm.log 2>&1 || true
          import requests, re, ssl
          from requests.adapters import HTTPAdapter
          class Legacy(HTTPAdapter):
              def init_poolmanager(self, *a, **k):
                  ctx = ssl.create_default_context(); ctx.options |= 0x4  # OP_LEGACY_SERVER_CONNECT
                  k["ssl_context"] = ctx; return super().init_poolmanager(*a, **k)
          s=requests.Session(); s.mount("https://api.mospi.gov.in", Legacy()); s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          base="https://api.mospi.gov.in/api/cpi/"
          r=s.get("https://api.mospi.gov.in/api-docs",timeout=40); print(r.text[:3200])
          import json
          for q in ["getCPIIndex?base_year=2024&Format=JSON&limit=50","getCPIIndex?BaseYear=2024&Format=JSON&limit=50",
                    "getCPIIndex?base_year=2024&year=2026&Format=JSON&limit=50","getCPIIndex?Format=JSON&limit=3000"]:
              try:
                  r=s.get(base+q,timeout=60); j=r.json(); d=j.get("data") or []
                  print("==",q,r.status_code,len(d), j.get("msg"))
                  keys=sorted({(x.get("baseyear"),x.get("year"),x.get("month")) for x in d}, key=str)[-6:]; print("  periods", keys)
                  for x in d:
                      if x.get("sector")=="Combined" and "General" in (x.get("group") or "") : print("  ", x)
              except Exception as e: print("==",q,"ERR",str(e)[:200])
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): global macro probe [skip ci]" && git push
