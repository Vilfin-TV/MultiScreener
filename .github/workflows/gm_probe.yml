name: Global macro probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/gm_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: |
          mkdir -p .probe
          python3 - <<'PY' > .probe/gm.log 2>&1 || true
          import requests, re, ssl
          from requests.adapters import HTTPAdapter
          class Legacy(HTTPAdapter):
              def init_poolmanager(self, *a, **k):
                  ctx = ssl.create_default_context(); ctx.options |= 0x4  # OP_LEGACY_SERVER_CONNECT
                  k["ssl_context"] = ctx; return super().init_poolmanager(*a, **k)
          s=requests.Session(); s.mount("https://api.mospi.gov.in", Legacy()); s.headers.update({"User-Agent":"Mozilla/5.0","Accept":"application/json"})
          base="https://api.mospi.gov.in/api/cpi/"
          import json, re as _r
          r=s.get("https://api.mospi.gov.in/api-docs/swagger-ui-init.js",timeout=40); t=r.text; print("INIT",r.status_code,len(t))
          print(t[:6100])
          for m in _r.finditer(r'"(/api/cpi/[A-Za-z]+)"', t): print("  path", m.group(1))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): global macro probe [skip ci]" && git push
