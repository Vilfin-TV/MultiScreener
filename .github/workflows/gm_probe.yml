name: Global macro probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/gm_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: |
          mkdir -p .probe
          python3 - <<'PY' > .probe/gm.log 2>&1 || true
          import requests, re
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36","Accept":"application/json, text/plain, */*"})
          urls=["https://api.mospi.gov.in/api/cpi/getCPIIndex?Format=JSON&base_year=2012&series=Current&year=2026&state_code=99&sector_code=3",
                "https://api.mospi.gov.in/api/cpi/getCPIIndex?base_year=2012&year=2026",
                "https://api.mospi.gov.in/api/cpi/getCPIInflation?base_year=2012&year=2026",
                "https://api.mospi.gov.in/api/cpi/getItemIndex?base_year=2012&year=2026",
                "https://esankhyiki.mospi.gov.in/macroindicators?product=cpi",
                "https://api.mospi.gov.in/",
                "https://www.mospi.gov.in/cpi",
                "https://cpi.mospi.gov.in/",
                "https://www.rbi.org.in/Scripts/BS_NSDPDisplay.aspx?param=4",
                "https://dbie.rbi.org.in/"]
          for u in urls:
              try:
                  r=s.get(u,timeout=40); t=r.text
                  print("==",u,r.status_code,len(t)); print(re.sub(r"\s+"," ",t[:700]))
                  for m in re.finditer(r"(CPI|Consumer Price|nflation)[^<]{0,120}",t): print("  >",m.group(0)[:130]); 
              except Exception as e: print("==",u,"ERR",e)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): global macro probe [skip ci]" && git push
