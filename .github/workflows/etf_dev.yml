name: ETF Dev Build (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: ['.github/workflows/etf_dev.yml']
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: pip install --upgrade pip yfinance pandas requests
      - run: python scripts/build_etf_momentum.py 2>&1 | tee etf_build.log
      - run: node scripts/verify_etf_momentum.js 2>&1 | tee -a etf_build.log || true
      - run: |
          mkdir -p .probe && cp etf_build.log .probe/
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .probe data/etf_momentum.json data/etf_hist.json; git commit -qm "chore(dev): etf build [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
