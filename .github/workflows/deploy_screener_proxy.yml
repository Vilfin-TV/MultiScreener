name: Deploy Screener Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - 'screener-proxy-worker.js'
      - 'wrangler.screener.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy screener-proxy-worker.js to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.screener.toml
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROC_API }}

      - name: Inject Secrets
        run: |
          echo "${{ secrets.GEMINI_API_KEY_2 }}" | npx wrangler secret put GEMINI_API_KEY --config wrangler.screener.toml
          echo "${{ secrets.PEXELS_API_KEY }}" | npx wrangler secret put PEXELS_API_KEY --config wrangler.screener.toml
          echo "${{ secrets.GROC_API }}" | npx wrangler secret put GROQ_API_KEY --config wrangler.screener.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
