name: Deploy Screener Proxy Worker

on:
  push:
    branches: [main]
    paths:
      - 'screener-proxy-worker.js'
      - 'wrangler.screener.toml'
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy screener-proxy-worker.js to Cloudflare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploys via wrangler.screener.toml so the R2 (MEDIA) binding is applied.
          command: deploy --config wrangler.screener.toml
          secrets: |
            GEMINI_API_KEY
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY_2 }}
