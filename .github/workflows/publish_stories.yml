name: Publish Stories Catalog
on:
  push:
    branches: [main]
    paths:
      - 'stories/v1/**'
      - 'scripts/build_stories.js'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: publish-stories
  cancel-in-progress: false
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Validate and build catalog
        run: node scripts/build_stories.js
      - name: Commit catalog if changed
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stories/v1/index.json
          if git diff --cached --quiet; then
            echo "Catalog unchanged"
          else
            git commit -m "chore(stories): refresh published catalog [skip ci]"
            git pull --rebase --autostash origin main
            git push origin main
          fi
