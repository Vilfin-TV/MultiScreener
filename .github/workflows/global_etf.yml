name: Global ETF Momentum Data

# Builds data/global_etf.json for global_etf_momentum.html (US-listed and global ETFs).
# scripts/build_global_etf.py writes the file ONLY when every critical accuracy check passes;
# otherwise the previous file stays online and the job fails.
# GitHub delays / drops scheduled runs, so there is a main run after the US close plus two retries.

on:
  schedule:
    # Timed for viewers in Asia: the US close is 20:00 UTC (summer) / 21:00 UTC (winter), so the first runs land
    # 25–40 minutes after it — about 2:00–3:00 am IST / 5:30–6:30 am JST — and the data is ready for the Asian morning.
    # A run before the close of the day keeps the previous session (the builder drops unfinished bars and never
    # replaces newer data with older).
    - cron: '27 20 * * 1-5'   # 20:27 UTC — summer close + 27 min
    - cron: '37 21 * * 1-5'   # 21:37 UTC — winter close + 37 min (summer: refresh)
    - cron: '47 22 * * 1-5'   # 22:47 UTC retry
    - cron: '33 1 * * 2-6'    # 01:33 UTC retry (before the Tokyo / Mumbai morning)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/build_global_etf.py'
      - 'scripts/global_plans.py'
      - 'scripts/global_dip.py'
      - '.github/workflows/global_etf.yml'

permissions:
  contents: write

concurrency:
  group: global-etf-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install --upgrade pip yfinance pandas numpy
      - name: Build, audit and write data/global_etf.json
        run: python scripts/build_global_etf.py
      - name: Publish
        run: |
          bash scripts/push_data.sh "chore(data): refresh global ETF momentum [skip ci]" data/global_etf.json data/global_etf_daily.json
