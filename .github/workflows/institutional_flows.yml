name: Verified FII and DII cash flows
on:
  workflow_dispatch:
  schedule:
    - cron: '15 13,16 * * 1-5'
    - cron: '15 16 * * 0,6'
  push:
    branches: [main]
    paths:
      - scripts/build_institutional_flows.py
      - scripts/institutional_ownership.json
      - scripts/test_institutional_flows.py
      - .github/workflows/institutional_flows.yml
permissions:
  contents: write
concurrency:
  group: institutional-flows
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install requests
      - name: Build and reconcile cash-market history
        run: python scripts/build_institutional_flows.py
      - name: Validate monetary identities and period boundaries
        run: python -m unittest discover -s scripts -p test_institutional_flows.py -v
      - name: Publish verified snapshot
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add data/mf/institutional_flows.json
          git diff --staged --quiet && exit 0
          git commit -m 'chore(data): verified FII/DII cash flows [skip ci]'
          for attempt in 1 2 3 4; do
            git push && exit 0
            git pull --rebase --autostash || { git rebase --abort; exit 1; }
            sleep $((attempt * 3))
          done
          exit 1
