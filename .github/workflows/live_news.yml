name: Update Live News Data

on:
  schedule:
    - cron: '*/15 * * * *'  # Runs every 15 minutes
  workflow_dispatch:        # Allows manual trigger

permissions:
  contents: write

jobs:
  update-news:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install dependencies
      run: npm install @xmldom/xmldom

    - name: Fetch Live News & Pexels Fallbacks
      env:
        PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      run: node scripts/build_live_news.js

    - name: Commit and Push Changes
      run: |
        git config --local user.name "github-actions[bot]"
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git add data/live_news.json
        git add data/pexels_cache.json || true
        git commit -m "Auto-update live news & pexels cache [skip ci]" || echo "No changes to commit"
        git push
