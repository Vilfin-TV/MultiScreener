name: Fund P/E dev build (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pe_probe.yml, scripts/build_fund_pe.py]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: pip install requests
      - run: |
          mkdir -p .probe
          python scripts/build_fund_pe.py > .probe/pe.log 2>&1 || true
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe data/mf/fund_pe.json 2>/dev/null; git add .probe
          git commit -m "chore(dev): fund P/E build [skip ci]" && git push
