name: PE probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pe_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: |
          python3 - <<'PY' > .probe/pe.log 2>&1 || true
          import requests, datetime as dt
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36","Accept":"*/*","Referer":"https://www.nseindia.com/"})
          d=dt.date.today()
          for i in range(8):
              x=d-dt.timedelta(days=i)
              for u in (f"https://nsearchives.nseindia.com/content/equities/peDetail/PE_{x:%d%m%y}.csv",):
                  r=s.get(u,timeout=40); print(u,r.status_code,len(r.content)); 
                  if r.status_code==200: print(r.text[:800]); break
              else: continue
              break
          r=s.get("https://nsearchives.nseindia.com/content/equities/EQUITY_L.csv",timeout=40); print("EQ",r.status_code,r.text[:400])
          for u in ("https://www.bseindia.com/", "https://nsearchives.nseindia.com/content/equities/sec_list.csv"):
              try: r=s.get(u,timeout=30); print(u,r.status_code,len(r.content))
              except Exception as e: print(u,e)
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): pe probe [skip ci]" && git push
