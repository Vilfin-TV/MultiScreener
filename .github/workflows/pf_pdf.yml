name: Portfolio PDF probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/pf_pdf.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        include:
          - {tag: q1, amcs: "Axis|Bandhan|UTI|LIC|WhiteOak Capital|Navi|NJ|Taurus"}
          - {tag: q2, amcs: "Angel One|Zerodha|Jio BlackRock|Franklin Templeton|Edelweiss|Kotak Mahindra|HSBC|Union"}
          - {tag: q3, amcs: "Sundaram|Canara Robeco|quant|Mahindra Manulife|Bank of India|Bajaj Finserv|ITI"}
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: |
          pip install --upgrade pip requests openpyxl xlrd pdfplumber playwright==1.48.0
          python -m playwright install --with-deps chromium
      - run: |
          IFS='|' read -ra A <<< "${{ matrix.amcs }}"; i=0
          for a in "${A[@]}"; do i=$((i+1)); echo "== $a" >> .probe/v2_${{ matrix.tag }}.log
            timeout 300 xvfb-run -a python .probe/pdf_probe2.py "$a" "${{ matrix.tag }}_$i" >> .probe/v2_${{ matrix.tag }}.log 2>&1 || echo "   timed out / failed: $a" >> .probe/v2_${{ matrix.tag }}.log
          done
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): portfolio page probe v2 ${{ matrix.tag }} [skip ci]"
          for i in 1 2 3 4 5; do git pull --rebase --autostash && git push && break; sleep $((i*7)); done
