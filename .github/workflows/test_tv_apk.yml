name: Test VilfinTV Android TV APK (emulator)

# Boots a real Android TV emulator, installs the APK, and drives it purely with
# remote key events (D-pad / OK / Back / media / channel) via androidtv/e2e/remote_test.sh.
# Screenshots of every stage + full logcat are uploaded as artifacts.
#
# SMOKE phase runs with no secrets. The login-gated FULL phase (providers →
# channel → fullscreen → next/prev → favorites) runs only when the repo secrets
# IPTV_USERNAME and IPTV_PASSWORD are present.

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'androidtv/**'
      - '.github/workflows/test_tv_apk.yml'

jobs:
  emulator-test:
    name: Android TV emulator remote test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Generate Gradle wrapper (pinned 8.7)
        working-directory: androidtv
        run: gradle wrapper --gradle-version 8.7 --distribution-type bin

      - name: Build debug APK (no signing secrets needed for the emulator)
        working-directory: androidtv
        run: ./gradlew :app:assembleDebug --no-daemon --stacktrace

      - name: Locate APK
        id: apk
        run: |
          APK=$(find androidtv/app/build/outputs/apk/debug -name '*.apk' | head -1)
          echo "path=$GITHUB_WORKSPACE/$APK" >> "$GITHUB_OUTPUT"
          ls -la "$APK"

      # KVM acceleration is required for a usable emulator on Linux runners.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run remote E2E on Android TV emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          APK_PATH: ${{ steps.apk.outputs.path }}
          IPTV_USER: ${{ secrets.IPTV_USERNAME }}
          IPTV_PASS: ${{ secrets.IPTV_PASSWORD }}
        with:
          api-level: 30
          target: android-tv
          arch: x86
          profile: tv_1080p
          cores: 2
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: bash androidtv/e2e/remote_test.sh

      - name: Upload screenshots + logcat
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tv-emulator-evidence
          path: androidtv/e2e/out
          if-no-files-found: warn
