name: MF Scheme Pages Probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: ['scripts/fetch_scheme_pages.py', '.github/workflows/mf_pages_probe.yml']
permissions:
  contents: write
concurrency: {group: mf-pages-probe, cancel-in-progress: true}
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests openpyxl xlrd playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: mkdir -p .probe && xvfb-run -a python scripts/fetch_scheme_pages.py 2>&1 | tee .probe/pages.log || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .probe; git add data/mf/scheme_pages.json 2>/dev/null || true
          git commit -qm "chore(probe): scheme pages [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
