name: Add IPTV sources

# Adds the IPTV sources listed in scripts/iptv_sources_add.json to the live
# lineup via the console's own API (screener-proxy /api/iptv/config +
# /api/iptv/settings), authenticated with an operator-scoped agent API key
# (repo secret IPTV_AGENT_KEY). Writes to the KV the worker actually reads — no
# namespace guessing. Idempotent. R2 per-source m3u cache fills on first fetch;
# D1 picks it up on the next sync-cron ticks.
#
# One-time setup: in link-console -> Agents, issue an API key with the "operator"
# scope, then add it as the repo secret IPTV_AGENT_KEY (format: vtv.<id>.<secret>).
# To add/remove future sources: edit scripts/iptv_sources_add.json and re-run.

on:
  workflow_dispatch: {}

jobs:
  add-sources:
    runs-on: ubuntu-latest
    env:
      WORKER: "https://screener-proxy.vilfintv.workers.dev"
      KEY: ${{ secrets.IPTV_AGENT_KEY }}
      SRC_FILE: "scripts/iptv_sources_add.json"
    steps:
      - uses: actions/checkout@v4

      - name: Preflight — key present
        run: |
          if [ -z "${KEY:-}" ]; then
            echo "::error::Repo secret IPTV_AGENT_KEY is not set. Issue an operator-scoped agent key in link-console -> Agents and add it as IPTV_AGENT_KEY."
            exit 1
          fi
          python3 -c "import json;print('sources to add:', [s['id'] for s in json.load(open('$SRC_FILE'))])"

      - name: Read current settings (GET /api/iptv/config)
        run: |
          set -euo pipefail
          code=$(curl -s -o resp.json -w "%{http_code}" -H "Authorization: Bearer $KEY" "$WORKER/api/iptv/config")
          echo "HTTP $code"
          [ "$code" = "200" ] || { echo "::error::config read failed ($code)"; cat resp.json; exit 1; }
          python3 -c "import json;d=json.load(open('resp.json'));\
          assert d.get('ok'), d;\
          s=d['settings'];\
          n=len(s.get('providers',[]));\
          assert n>=20, f'only {n} providers — refusing (bad read)';\
          json.dump(s, open('cur.json','w'));\
          print('current providers:', n)"

      - name: Merge in the sources (idempotent, guarded)
        run: |
          set -euo pipefail
          python3 scripts/add_iptv_source.py < cur.json > merged.json
          python3 -c "import json;s=json.load(open('merged.json'));s=s.get('settings',s);json.dump({'settings':s},open('payload.json','w'))"

      - name: Save (POST /api/iptv/settings)
        run: |
          set -euo pipefail
          code=$(curl -s -o save.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $KEY" -H "Content-Type: application/json" \
            --data @payload.json "$WORKER/api/iptv/settings")
          echo "HTTP $code"; head -c 400 save.json; echo
          [ "$code" = "200" ] || { echo "::error::save failed ($code)"; exit 1; }

      - name: Verify all sources are live
        run: |
          set -euo pipefail
          curl -s -H "Authorization: Bearer $KEY" "$WORKER/api/iptv/config" > check.json
          python3 -c "import json;\
          want={s['id'] for s in json.load(open('$SRC_FILE'))};\
          have={p.get('id') for p in json.load(open('check.json'))['settings'].get('providers',[])};\
          missing=want-have;\
          print('added & verified:', sorted(want&have));\
          print('MISSING:', sorted(missing)) or None;\
          import sys;sys.exit(1 if missing else 0)"
