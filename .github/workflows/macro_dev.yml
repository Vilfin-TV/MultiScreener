name: Macro dev build (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/macro_dev.yml, scripts/build_macro.py]
permissions: {contents: write}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: pip install requests
      - run: |
          mkdir -p .probe
          python scripts/build_macro.py > .probe/macro.log 2>&1 || true
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe data/mf/macro.json data/mf/val_hist.json
          git commit -m "chore(dev): macro build [skip ci]" && git pull --rebase && git push
