name: Decode Daily Market Report

# Turns data/market_sentiment_snapshot.json into a stock-news article targeting
# 10:00 JST on weekdays (Mon-Fri) and Saturdays. No report on Sundays.
#
# Schedule: '0 23 * * 0-5' = 23:00 UTC Sun-Fri == 08:00 JST Mon-Sat.
# GitHub's once-a-day crons run with a chronic 1-3 hour delay vs nominal time
# (documented best-effort behaviour, unfixable). Scheduling at 08:00 JST means
# the job actually fires at 09:30-11:00 JST — centred on 10:00 JST.
# The decode_market_report_watchdog.yml guarantees delivery by 12:00 JST even
# on a worst-case 3-hour delay day.
#
# Snapshot dependency: market_report.yml targets 07:00 JST (22:00 UTC) and
# commits the snapshot by ~08:00 JST (23:00 UTC). This job's 23:00 UTC trigger
# fires AFTER that snapshot commit, but with GitHub's delay it actually executes
# 60-120 minutes later — well clear of any snapshot race.
#
# Weekdays (Mon-Fri JST): day-over-day decode with a 14-factor comparison chart.
# Saturday (JST): weekly decode covering the trailing week's score trajectory.
# Sunday (JST): no cron fires — the script's Sunday guard is a safety net only.
#
# Hybrid push strategy: the Python script writes the article to
# data/decode_pending.json (a staging file no other job touches). The
# "merge-and-push" step re-reads the latest content.json from origin on
# every retry and re-inserts the article, so push rejections from
# concurrent jobs can never cause a lost-update race. 20 retries with
# progressive backoff outlast any morning traffic burst.
#
# Requires repository secrets (already present, same as upload_story_images.yml):
#   CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID

on:
  schedule:
    - cron: '0 23 * * 0-5'  # 23:00 UTC Sun-Fri == 08:00 JST Mon-Sat (lands ~10:00 JST)
  workflow_dispatch:          # manual trigger for testing / watchdog dispatch

permissions:
  contents: write             # required for git push via GITHUB_TOKEN

jobs:
  decode-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          # Full history: this repo has very high commit velocity (~150
          # commits/day from Hermes, share-page regen, several data-refresh
          # crons), so `git log -- <path>` on a shallow clone could walk back
          # through 1000+ unrelated commits before finding a week's worth of
          # snapshot-file commits. Correctness for the weekly comparison
          # matters more than shaving clone time on a once-daily job.
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install matplotlib

      - name: Generate article into staging file (data/decode_pending.json)
        id: decode
        run: |
          python3 scripts/decode_market_report.py | tee /tmp/decode_output.txt
          if grep -q '^PENDING_FILE=' /tmp/decode_output.txt; then
            echo "pending_file=$(grep '^PENDING_FILE=' /tmp/decode_output.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
            echo "chart_local_path=$(grep '^CHART_LOCAL_PATH=' /tmp/decode_output.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
            echo "chart_r2_key=$(grep '^CHART_R2_KEY=' /tmp/decode_output.txt | cut -d= -f2-)" >> "$GITHUB_OUTPUT"
            echo "has_report=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_report=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install wrangler
        if: steps.decode.outputs.has_report == 'true'
        run: npm install -g wrangler@4

      - name: Upload chart to R2 (bucket vilfintv-media)
        if: steps.decode.outputs.has_report == 'true'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler r2 object put "vilfintv-media/${{ steps.decode.outputs.chart_r2_key }}" \
            --file="${{ steps.decode.outputs.chart_local_path }}" \
            --content-type=image/jpeg --remote

      - name: Merge staging file into content.json and push (20 retries, progressive backoff)
        if: steps.decode.outputs.has_report == 'true'
        run: |
          git config --local user.name "github-actions[bot]"
          git config --local user.email "github-actions[bot]@users.noreply.github.com"

          PENDING="${{ steps.decode.outputs.pending_file }}"

          # Extract the idempotency key (decode_date) from the pending article
          DECODE_DATE=$(python3 -c "import json; d=json.load(open('$PENDING')); print(d['decode_date'])")
          echo "Decode date: $DECODE_DATE"

          PUSHED=false
          for i in $(seq 1 20); do
            # Pull the very latest main so we work with fresh content.json
            git pull --rebase --autostash origin main

            # Idempotency check: abort if this date's article is already in content.json
            ALREADY=$(python3 -c "
          import json, sys
          d = json.load(open('content.json'))
          date = '$DECODE_DATE'
          found = any(x.get('decode_date') == date or ('decode' in x.get('heading','').lower() and date in x.get('heading','')) for x in d)
          print('yes' if found else 'no')
          ")
            if [ "$ALREADY" = "yes" ]; then
              echo "Article for $DECODE_DATE already in content.json (published by a prior retry). Done."
              PUSHED=true
              break
            fi

            # Merge pending article into the freshly-pulled content.json
            python3 -c "
          import json, os
          pending = json.load(open('$PENDING'))
          data = json.load(open('content.json'))
          # Guard: don't double-insert
          date = pending['decode_date']
          if not any(x.get('decode_date') == date for x in data):
              data.append(pending)
              json.dump(data, open('content.json', 'w'), indent=2, ensure_ascii=False)
              print('Merged.')
          else:
              print('Already present, skipping insert.')
          "
            git add content.json data/decode_pending.json
            git diff --cached --quiet && echo "Nothing to commit" && PUSHED=true && break

            git commit -m "feat(content): decode daily market report ${DECODE_DATE} [skip ci]"
            if git push origin main; then
              echo "Push succeeded on attempt $i."
              PUSHED=true
              break
            fi

            # Progressive backoff: 10s, 20s, 30s … capped at 60s
            SLEEP=$(( i * 10 < 60 ? i * 10 : 60 ))
            echo "Push rejected (attempt $i/20) — retrying in ${SLEEP}s..."
            # Undo the local commit and revert content.json to HEAD so that
            # --autostash on the next git pull doesn't carry the merged
            # content.json into the next iteration (which would fool the
            # idempotency check into thinking the article was already pushed).
            git reset --soft HEAD~1
            git restore --staged content.json
            git restore content.json
            sleep $SLEEP
          done

          if [ "$PUSHED" != "true" ]; then
            echo "::error::All 20 push attempts failed. The article was generated but not published."
            exit 1
          fi
