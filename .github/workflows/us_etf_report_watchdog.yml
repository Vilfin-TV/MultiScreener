name: US ETF Report Watchdog

# The main "US ETF Daily Report" workflow fires on a fixed cron
# (10 2 * * *, i.e. 11:10 AM JST). GitHub's best-effort scheduler runs
# low-frequency crons with a chronic delay of 20-90+ minutes. This watchdog
# checks repeatedly across a grace window and dispatches the report if the
# scheduled run hasn't landed yet, guaranteeing delivery.
#
# Offset by 10 minutes from the US Stock Report Watchdog to avoid dispatch
# collisions. Each check is idempotent — it only dispatches if no run
# (scheduled or otherwise) has landed in the last 3 hours.

on:
  schedule:
    # Grace-window checks offset by 10 min from the stock watchdog. Starts at
    # 02:10 UTC (11:10 JST) and runs every 20 min through 03:50 UTC (12:50 JST).
    - cron: '10,30,50 2 * * *'    # 02:10, 02:30, 02:50 UTC = 11:10, 11:30, 11:50 JST
    - cron: '10,30,50 3 * * *'    # 03:10, 03:30, 03:50 UTC = 12:10, 12:30, 12:50 JST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent US ETF Report run, trigger one if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          gh run list --repo "$REPO" --workflow="us_etf_report.yml" \
            --json createdAt,status,conclusion,event --limit 20 > /tmp/runs.json

          RECENT_COUNT=$(python3 - /tmp/runs.json <<'PYEOF'
          import json, sys, datetime
          with open(sys.argv[1]) as f:
              data = json.load(f)
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(hours=3)
          # A run only counts as "handled" if it succeeded, or is still
          # in-flight (queued/in_progress). A completed-but-failed or
          # -cancelled run must NOT count, or the watchdog would wrongly
          # conclude nothing needs retrying.
          recent = [
              r for r in data
              if datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) > cutoff
              and (r["status"] != "completed" or r["conclusion"] == "success")
          ]
          print(len(recent))
          PYEOF
          )

          echo "Recent successful/in-flight runs (last 3h) for US ETF Report: $RECENT_COUNT"

          if [ "$RECENT_COUNT" -eq 0 ]; then
            echo "No recent successful run found - the scheduled trigger either didn't fire or failed. Dispatching now."
            gh workflow run us_etf_report.yml --repo "$REPO"
          else
            echo "US ETF Report already ran successfully (or is running) recently - nothing to do."
          fi
