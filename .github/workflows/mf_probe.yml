name: MF Screener Dev Validation (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: ['scripts/build_mf_screener.py', 'scripts/mf_common.py', 'scripts/verify_mf_screener.js', '.github/workflows/mf_probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  dev:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Probe AMFI TER parameters (diagnostic)
        continue-on-error: true
        run: |
          python3 - <<'PY' > .probe_ter.txt 2>&1 || true
          import re, requests
          S = requests.Session(); S.headers["User-Agent"] = "Mozilla/5.0"
          base = "https://www.amfiindia.com"
          t = S.get(base + "/ter-of-mf-schemes", timeout=60).text
          for j in sorted(set(re.findall(r'/_next/static/chunks/[^"\']+\.js', t))):
              js = S.get(base + j, timeout=60).text
              for m in re.finditer(r"populate-te-rdata-revised|mfId|MF_ID|populate-amc|amc-list|mfName", js):
                  print(j, "::", js[max(0, m.start()-700):m.end()+700].replace("\n", " ")); print("-----")
          PY
          mkdir -p .probe && head -c 60000 .probe_ter.txt > .probe/ter_probe.txt
      - uses: actions/cache/restore@v4

        with: {path: .mfcache, key: 'mf-dev-${{ github.run_id }}', restore-keys: 'mf-dev-'}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install numpy scipy requests
      - uses: actions/setup-node@v4
        with: {node-version: '20'}
      - run: mkdir -p .mfcache && python scripts/build_mf_screener.py --workers 10 2>&1 | tee .mfcache/build.log; test ${PIPESTATUS[0]} -eq 0
      - uses: actions/cache/save@v4
        if: always()
        with: {path: .mfcache, key: 'mf-dev-${{ github.run_id }}'}
      - run: node scripts/verify_mf_screener.js 2>&1 | tee .mfcache/verify.log || true
      - name: Commit data + validation report to dev branch
        if: always()
        run: |
          mkdir -p .probe && cp .mfcache/validation.json .mfcache/build.log .mfcache/verify.log .probe/ 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/mf .probe
          git commit -qm "chore(dev): MF screener build + validation [skip ci]" || exit 0
          git pull --rebase -q origin ${{ github.ref_name }} || true
          git push origin HEAD:${{ github.ref_name }}
