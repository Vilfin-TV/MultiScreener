name: MF Data Probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: ['scripts/mf_probe.py', '.github/workflows/mf_probe.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests yfinance pandas
      - run: python scripts/mf_probe.py
      - name: Commit probe samples
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .probe
          git commit -m "chore(probe): MF data source samples [skip ci]" || exit 0
          git push origin HEAD:${{ github.ref_name }}
