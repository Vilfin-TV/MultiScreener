name: Deploy India MF Screener Cron Trigger

# Deploys mf_cron_worker.js (Cloudflare cron) which dispatches
# mf_screener.yml whenever the published NAV date is behind (evening + early morning).
on:
  push:
    branches: [main]
    paths:
      - 'mf_cron_worker.js'
      - 'wrangler.mfcron.toml'
      - '.github/workflows/deploy_mf_cron.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check GH_TOKEN can dispatch mf_screener.yml
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          code=$(curl -s -o /tmp/wf.json -w "%{http_code}" \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mf_screener.yml")
          echo "workflow lookup: HTTP $code"
          test "$code" = "200" || { echo "::error::GH_TOKEN cannot read Actions workflows (HTTP $code)"; exit 1; }

      - name: Deploy with Wrangler
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.mfcron.toml

      - name: Set GH_TOKEN secret on the worker
        run: echo "${{ secrets.GH_TOKEN }}" | npx --yes wrangler@3 secret put GH_TOKEN --config wrangler.mfcron.toml
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      - name: Smoke test — dispatch one refresh with the same token
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          code=$(curl -s -o /dev/null -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/actions/workflows/mf_screener.yml/dispatches" \
            -d '{"ref":"main"}')
          echo "dispatch: HTTP $code"
          test "$code" = "204" || { echo "::error::GH_TOKEN cannot dispatch workflows (HTTP $code) — the cron worker will not be able to trigger refreshes"; exit 1; }
