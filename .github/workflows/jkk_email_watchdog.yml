name: JKK Vacancy Digest Watchdog

# JKK Vacancy Email Digest fires on 5 daily crons (00:35 / 02:03 / 05:30 /
# 07:45 / 11:15 UTC = 09:35 / 11:03 / 14:30 / 16:45 / 20:15 JST - 2 morning,
# 2 afternoon, 1 late evening, per owner request 2026-07-16). Same root
# cause as Market Report's original issue: this repo's GitHub Actions
# scheduler runs low-frequency crons with a chronic 30-90+ min delay
# (sometimes a full no-show) versus their nominal time.
#
# JKK already had a backup for this - a separate Cloudflare Worker
# (jkk_cron_worker.js / wrangler.jkkcron.toml) that dispatches this workflow
# if GitHub's own cron didn't fire. Investigated 2026-07-14: that worker IS
# deployed and live, but its GH_TOKEN secret is failing every GitHub API call
# (its own health endpoint reports recentDigestRuns: -1, which the worker's
# code returns specifically when the GitHub API call itself fails - an
# identical call with a known-good token succeeds fine against the same
# endpoint). A manually-created PAT can silently expire or be revoked with
# no alert anywhere, since a scheduled Worker only logs to a console nobody
# watches - that's what happened here.
#
# This watchdog avoids that whole failure class: it uses GitHub's own
# auto-provisioned per-run token (via the `permissions` block below), which
# never expires and needs no manually-managed secret at all. Same
# idempotent design as market_report_watchdog.yml: check a grace window
# after each target time, dispatch only if nothing has run recently.
#
# The lookback window is intentionally SHORT (70 min) rather than reused
# from Market Report's 3h - JKK's slots are much closer together (the
# tightest gap, 00:35 -> 02:03, is only 88 min - unchanged by adding the
# 16:45/20:15 JST slots, which sit 135/210 min from their neighbors), so a
# long lookback would see the previous slot's run and wrongly think the
# current slot already fired. 70 min stays safely under that 88-min
# minimum gap while still covering each slot's own grace window below.
#
# INCIDENT 2026-07-16: this watchdog (and the main digest cron) went
# completely silent for the whole morning - not one of the 12 scheduled
# trigger attempts fired. Investigated via run-history timing across the
# whole repo (GitHub gives no log at all for a schedule event it decides to
# skip, so this is inference from evidence, not a confirmed root cause):
# monitor_fix.yml (target 00:00 UTC) has fired ~2 hours late EVERY day this
# past week, not just that day - proving this repo's scheduler runs
# chronically ~2h behind around that time of day, not just occasionally.
# GitHub documents that a workflow's OWN schedule entries get silently
# skipped once "the delay is longer than the next scheduled run" - with
# checks only 20 min apart, a ~2h backlog is long enough to supersede (and
# so drop) every single one of them in a cascade, all the way through a
# slot's grace window. Checks are now 40 min apart (below) specifically so
# each one needs a smaller relative backlog to survive, and each slot's
# window extends to +140 min so a very-late scheduler still gets a chance
# to catch up before giving up on that slot entirely.

on:
  schedule:
    # Slot 1 target 00:35 UTC (09:35 JST) - checks +20/+60/+100/+140 min
    - cron: '55 0 * * *'
    - cron: '35 1 * * *'
    - cron: '15 2 * * *'
    - cron: '55 2 * * *'
    # Slot 2 target 02:03 UTC (11:03 JST) - checks +20/+60/+100/+140 min
    - cron: '23 2 * * *'
    - cron: '3 3 * * *'
    - cron: '43 3 * * *'
    - cron: '23 4 * * *'
    # Slot 3 target 05:30 UTC (14:30 JST) - checks +20/+60/+100/+140 min
    - cron: '50 5 * * *'
    - cron: '30 6 * * *'
    - cron: '10 7 * * *'
    - cron: '50 7 * * *'
    # Slot 4 target 07:45 UTC (16:45 JST) - checks +20/+60/+100/+140 min
    - cron: '5 8 * * *'
    - cron: '45 8 * * *'
    - cron: '25 9 * * *'
    - cron: '5 10 * * *'
    # Slot 5 target 11:15 UTC (20:15 JST) - checks +20/+60/+100/+140 min
    - cron: '35 11 * * *'
    - cron: '15 12 * * *'
    - cron: '55 12 * * *'
    - cron: '35 13 * * *'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent JKK digest run, trigger one if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          gh run list --repo "$REPO" --workflow="jkk_email_watch.yml" \
            --json createdAt,status,conclusion,event --limit 20 > /tmp/runs.json

          RECENT_COUNT=$(python3 - /tmp/runs.json <<'PYEOF'
          import json, sys, datetime
          with open(sys.argv[1]) as f:
              data = json.load(f)
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(minutes=70)
          # A run only counts as "handled" if it succeeded, or is still
          # in-flight (queued/in_progress). A completed-but-failed run (e.g.
          # a transient upstream API error) must NOT count, or the watchdog
          # would wrongly conclude nothing needs retrying - the exact
          # scenario it exists to catch (2026-07-16 UR API 500 incident).
          recent = [
              r for r in data
              if datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) > cutoff
              and (r["status"] != "completed" or r["conclusion"] == "success")
          ]
          print(len(recent))
          PYEOF
          )

          echo "Recent successful/in-flight runs (last 70 min) for JKK Vacancy Email Digest: $RECENT_COUNT"

          if [ "$RECENT_COUNT" -eq 0 ]; then
            echo "No recent successful run found - the scheduled trigger either didn't fire or failed. Dispatching now."
            gh workflow run jkk_email_watch.yml --repo "$REPO"
          else
            echo "JKK digest already ran successfully (or is running) recently - nothing to do."
          fi
