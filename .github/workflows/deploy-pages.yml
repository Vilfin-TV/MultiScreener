name: Deploy to GitHub Pages

# This workflow requires the repo's Pages source to be set to "GitHub
# Actions" (Settings -> Pages -> Build and deployment -> Source). It
# currently isn't — Pages is on the legacy "Deploy from a branch" source,
# which already auto-publishes every push to main on its own and does
# not grant this workflow permission to deploy, so it fails on every run
# (see actions/deploy-pages "Deployment failed, try again later").
#
# Disabled the automatic trigger to stop the failure-email spam without
# deleting a workflow that's otherwise correctly written. Once the Pages
# source is switched to "GitHub Actions" in repo settings, restore the
# `push: branches: [main]` trigger below (or just run this manually once)
# and it will work as-is.
on:
  workflow_dispatch: {}

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
