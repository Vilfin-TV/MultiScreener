name: MF Exit Load Probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: ['scripts/mf_exit_probe.py', '.github/workflows/mf_exit_probe.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install requests playwright==1.48.0 && python -m playwright install --with-deps chromium
      - run: mkdir -p .probe && xvfb-run -a python scripts/mf_exit_probe.py 2>&1 | tee .probe/exit_probe.log || true
      - run: |
          git config user.name "github-actions[bot]"; git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f .probe; git commit -qm "chore(probe): exit loads [skip ci]" || exit 0
          for i in 1 2 3; do git pull --rebase -q origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }} && break; sleep 5; done
