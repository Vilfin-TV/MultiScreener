name: RSS destination regression
on:
  pull_request:
    paths:
      - 'worker.js'
      - 'tests/rss-destination.test.cjs'
      - '.github/workflows/rss-destination-test.yml'
  push:
    branches:
      - 'phase1/rss-destination-hardening'
jobs:
  rss-destination:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check Worker JavaScript syntax
        run: node --check worker.js
      - name: Test RSS destination and redirects
        run: node tests/rss-destination.test.cjs
