name: US ETF Daily Report (Backup Run)

on:
  workflow_run:
    workflows: ["US ETF Daily Report"]
    types:
      - completed

jobs:
  run-backup:
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Wait 30 minutes before retry
        run: sleep 1800

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fetch subscriber list from D1
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          DB_ID="0bdd24a2-6109-4225-a873-90c216c530ab"
          HTTP_CODE=$(curl -s -o /tmp/d1_result.json -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/d1/database/${DB_ID}/query" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
            -H "Content-Type: application/json" \
            -d '{"sql":"SELECT email FROM subscribers"}')
          echo "D1 API HTTP status: $HTTP_CODE"
          if [ "$HTTP_CODE" = "200" ]; then
            python3 -c "
          import json, sys
          try:
              data = json.load(open('/tmp/d1_result.json'))
              if not data.get('success'):
                  print(f'D1 error: {data}', file=sys.stderr)
                  sys.exit(1)
              rows = data['result'][0]['results']
              emails = [r['email'] for r in rows
                        if r.get('email') and r['email'] != 'test@vilfintv.com']
              print(json.dumps(emails))
          except Exception as e:
              print(f'D1 parse error: {e}', file=sys.stderr)
              sys.exit(1)
            " > /tmp/subscribers.json && \
            COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/subscribers.json'))))" 2>/dev/null || echo 0) && \
            echo "Subscriber count from D1: $COUNT"
          else
            echo "D1 fetch failed (HTTP $HTTP_CODE) — skipping subscriber file so script falls back to SUBSCRIBER_WORKER_URL"
          fi

      - name: Run US ETF Analyzer Script (Retry)
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBSCRIBER_WORKER_URL: ${{ secrets.SUBSCRIBER_WORKER_URL }}
          SUBSCRIBER_WORKER_SECRET: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SUBSCRIBER_LIST_FILE: /tmp/subscribers.json
        run: |
          python us_etf_analyzer.py
