name: India MF Screener Data

# Builds data/mf/ (every open-ended Direct-Growth mutual fund in India) used by
# india_mf_screener.html. Fund houses publish each business day's NAV to AMFI
# by 11 pm IST (overseas FoFs the next morning).
#
# Reliability: GitHub delays or skips low-frequency crons in this repository,
# so — like the ETF page — this workflow also wakes after every "Update Market
# Sentiment" run (every 30 min, reliable). The cheap "due" gate starts a build
# only when AMFI has a newer NAV date than the published data, so the page
# refreshes within ~30 min of NAVs being available (late evening or early
# morning) and every other wake-up costs seconds. Runs are serialised by the
# concurrency group, so a queued wake-up re-checks after the previous build.
on:
  workflow_run:
    workflows: ["Update Market Sentiment"]
    types: [completed]
  schedule:
    - cron: '0 0 * * *'      # 05:30 IST
    - cron: '0 1 * * *'      # 06:30 IST retry
    - cron: '30 2 * * *'     # 08:00 IST retry
    - cron: '0 5 * * *'      # 10:30 IST (late overseas FoF NAVs)
  workflow_dispatch:
    inputs:
      force:
        description: 'Rebuild even if data is current'
        type: boolean
        default: false
  push:
    branches: [main]
    paths:
      - 'scripts/build_mf_screener.py'
      - 'scripts/mf_common.py'
      - 'scripts/verify_mf_screener.js'
      - '.github/workflows/mf_screener.yml'

permissions:
  contents: write

concurrency:
  group: mf-screener-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  due:
    name: Is a refresh due?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - name: Checkout published data and audit script
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          sparse-checkout: |
            data/mf/screener.json
            scripts/audit_mf_live.py
          sparse-checkout-cone-mode: false

      - name: Live audit — freshness, NAVs and returns vs AMFI official data
        id: check
        env:
          EVENT: ${{ github.event_name }}
          FORCE: ${{ github.event.inputs.force }}
        run: |
          # deep return audit three times a day (07:00, 13:00, 19:00 IST wake-ups)
          H=$(TZ=Asia/Kolkata date +%H); M=$(TZ=Asia/Kolkata date +%M)
          if { [ "$H" = "07" ] || [ "$H" = "13" ] || [ "$H" = "19" ]; } && [ "$M" -lt 30 ]; then export DEEP=true; fi
          python3 scripts/audit_mf_live.py

  build:
    name: Build & verify data/mf
    needs: due
    if: needs.due.outputs.run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Restore NAV-history cache
        uses: actions/cache/restore@v4
        with:
          path: .mfcache
          key: mf-cache-${{ github.run_id }}
          restore-keys: mf-cache-

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install --upgrade pip numpy scipy requests

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Keep the previously published data for the day-over-day audit
        run: cp data/mf/screener.json "$RUNNER_TEMP/prev_screener.json" 2>/dev/null || true

      - name: Build India MF screener data
        run: python scripts/build_mf_screener.py --workers 10

      - name: Save NAV-history cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .mfcache
          key: mf-cache-${{ github.run_id }}

      - name: Verify (independent JS re-computation, structure and day-over-day checks)
        env:
          MF_PREV: ${{ runner.temp }}/prev_screener.json
        run: node scripts/verify_mf_screener.js

      - name: Validation summary
        run: |
          python3 - <<'PY'
          import json
          v = json.load(open(".mfcache/validation.json"))
          print("NAV as of", v["asOf"], "· risk as of", v["riskAsOf"], "· funds", v["analysed"])
          print("Agreement with independently published returns:", json.dumps(v["vsIndependent"], indent=1))
          PY

      - name: Commit (with rebase-and-retry)
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          git config --global user.name  "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A data/mf
          if git diff --staged --quiet; then
            echo "No changes to MF screener data."
            exit 0
          fi
          git commit -m "chore(data): refresh India MF screener [skip ci]"
          for attempt in 1 2 3 4; do
            if git push origin HEAD:"$BRANCH"; then
              echo "Pushed."
              exit 0
            fi
            echo "Push rejected (attempt $attempt). Rebasing..."
            git pull --rebase --autostash origin "$BRANCH" || git rebase --abort
            sleep $((attempt * 5))
          done
          echo "All push attempts failed."
          exit 1
