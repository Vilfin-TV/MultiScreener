name: Index list probe (temporary)
on:
  push:
    branches: [claude/festive-bell-an714y]
    paths: [.github/workflows/idx_probe.yml]
permissions: {contents: write}
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {ref: claude/festive-bell-an714y}
      - run: |
          mkdir -p .probe
          python3 - <<'PY' > .probe/idx.log 2>&1 || true
          import requests, datetime as dt, csv, io
          s=requests.Session(); s.headers.update({"User-Agent":"Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/129.0 Safari/537.36","Accept":"*/*","Referer":"https://www.nseindia.com/"})
          d=dt.date.today()
          for i in range(8):
              x=d-dt.timedelta(days=i)
              r=s.get(f"https://nsearchives.nseindia.com/content/indices/ind_close_all_{x:%d%m%Y}.csv",timeout=40)
              if r.status_code==200 and len(r.content)>1000: break
          print("date",x)
          rows=list(csv.DictReader(io.StringIO(r.content.decode('utf-8-sig','replace'))))
          print(list(rows[0].keys()))
          for row in rows: print(row.get("Index Name"),"|",row.get("P/E"))
          PY
          git config user.name "github-actions[bot]"; git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add .probe && git commit -m "chore(dev): index probe [skip ci]" && git push
