name: Daily Market Report Watchdog

# The main "Daily Market Report" workflow fires on a fixed cron
# (30 21 * * *, i.e. 6:30am JST). Investigated 2026-07-13: this repo's
# GitHub Actions scheduler runs low-frequency crons (once per day, or
# once per several hours) with a CHRONIC delay of 30-90+ minutes versus
# their nominal time — confirmed by checking world.yml's (every-3-hours)
# actual fire times over the last two days, every single one landed
# well past its nominal slot. High-frequency crons (every 5-30 min,
# live_news/market_sentiment/breaking_news/sports) never visibly show
# this because they get many chances per hour, so a delay just looks
# like normal jitter; a once-a-day job makes the same delay look like a
# missing run. This is GitHub's own documented best-effort scheduling
# behavior, not something fixable by editing the workflow file itself.
#
# The existing "backup" workflow can't help here either — it only
# reacts to the main job actually running and *failing*
# (workflow_run: types: [completed]); a schedule that never fires never
# emits a completed event for anything to react to.
#
# Fix: instead of one fixed-offset check (which is itself just another
# cron subject to the same delay), check repeatedly across a grace
# window after the target time, extending all the way to 23:50 UTC
# (08:50 JST) - a hard guarantee the report goes out before 9:00 AM JST
# every trading day, even in a worst-case multi-hour delay. Each check
# is idempotent — it only dispatches if no run (scheduled or otherwise)
# has landed in the last 3 hours, so once the real delayed run lands
# (or this watchdog dispatches one itself), every later check in the
# window is a no-op.

on:
  schedule:
    # Grace-window checks that START at the 21:30 UTC (06:30 JST) target and run
    # every 20 min through 23:50 UTC (08:50 JST) - a hard deadline guarantee that
    # the report goes out before 9:00 AM JST even if the native cron is very late.
    # Starting AT the target (not before) is deliberate: the check dispatches only
    # when no run has landed in the last 3h, so beginning earlier than 21:30 would
    # fire the report ahead of 06:30 JST.
    - cron: '30,50 21 * * *'       # 21:30, 21:50 UTC = 06:30, 06:50 JST
    - cron: '10,30,50 22 * * *'    # 22:10, 22:30, 22:50 UTC = 07:10, 07:30, 07:50 JST
    - cron: '10,30,50 23 * * *'    # 23:10, 23:30, 23:50 UTC = 08:10, 08:30, 08:50 JST
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent Daily Market Report run, trigger one if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          gh run list --repo "$REPO" --workflow="market_report.yml" \
            --json createdAt,status,conclusion,event --limit 20 > /tmp/runs.json

          RECENT_COUNT=$(python3 - /tmp/runs.json <<'PYEOF'
          import json, sys, datetime
          with open(sys.argv[1]) as f:
              data = json.load(f)
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(hours=3)
          # A run only counts as "handled" if it succeeded, or is still
          # in-flight (queued/in_progress). A completed-but-failed or
          # -cancelled run must NOT count, or the watchdog would wrongly
          # conclude nothing needs retrying - the exact scenario it exists
          # to catch (same bug class found and fixed in the JKK digest
          # watchdog on 2026-07-16: a real script/SMTP failure would have
          # silently gone unnoticed and unretried).
          recent = [
              r for r in data
              if datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) > cutoff
              and (r["status"] != "completed" or r["conclusion"] == "success")
          ]
          print(len(recent))
          PYEOF
          )

          echo "Recent successful/in-flight runs (last 3h) for Daily Market Report: $RECENT_COUNT"

          if [ "$RECENT_COUNT" -eq 0 ]; then
            echo "No recent successful run found - the scheduled trigger either didn't fire or failed. Dispatching now."
            gh workflow run market_report.yml --repo "$REPO"
          else
            echo "Daily Market Report already ran successfully (or is running) recently - nothing to do."
          fi
