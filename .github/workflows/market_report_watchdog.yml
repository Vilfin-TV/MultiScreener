name: Daily Market Report Watchdog

# The main "Daily Market Report" workflow fires on a fixed cron
# (0 21 * * *, i.e. 6:00am JST). Investigated 2026-07-13: this repo's
# GitHub Actions scheduler runs low-frequency crons (once per day, or
# once per several hours) with a CHRONIC delay of 30-90+ minutes versus
# their nominal time — confirmed by checking world.yml's (every-3-hours)
# actual fire times over the last two days, every single one landed
# well past its nominal slot. High-frequency crons (every 5-30 min,
# live_news/market_sentiment/breaking_news/sports) never visibly show
# this because they get many chances per hour, so a delay just looks
# like normal jitter; a once-a-day job makes the same delay look like a
# missing run. This is GitHub's own documented best-effort scheduling
# behavior, not something fixable by editing the workflow file itself.
#
# The existing "backup" workflow can't help here either — it only
# reacts to the main job actually running and *failing*
# (workflow_run: types: [completed]); a schedule that never fires never
# emits a completed event for anything to react to.
#
# Fix: instead of one fixed-offset check (which is itself just another
# cron subject to the same delay), check repeatedly across a 2-hour
# grace window after the target time. Each check is idempotent — it
# only dispatches if no run (scheduled or otherwise) has landed in the
# last 3 hours, so once the real delayed run lands (or this watchdog
# dispatches one itself), every later check in the window is a no-op.

on:
  schedule:
    - cron: '*/20 21-22 * * *'  # every 20 min, 21:00-22:59 UTC (6:00-8:59am JST)
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Check for a recent Daily Market Report run, trigger one if missing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          REPO="${{ github.repository }}"

          gh run list --repo "$REPO" --workflow="market_report.yml" \
            --json createdAt,status,conclusion,event --limit 20 > /tmp/runs.json

          RECENT_COUNT=$(python3 - /tmp/runs.json <<'PYEOF'
          import json, sys, datetime
          with open(sys.argv[1]) as f:
              data = json.load(f)
          now = datetime.datetime.now(datetime.timezone.utc)
          cutoff = now - datetime.timedelta(hours=3)
          recent = [
              r for r in data
              if datetime.datetime.fromisoformat(r["createdAt"].replace("Z", "+00:00")) > cutoff
          ]
          print(len(recent))
          PYEOF
          )

          echo "Recent runs (last 3h) for Daily Market Report: $RECENT_COUNT"

          if [ "$RECENT_COUNT" -eq 0 ]; then
            echo "No recent run found — the scheduled trigger likely didn't fire. Dispatching now."
            gh workflow run market_report.yml --repo "$REPO"
          else
            echo "Daily Market Report already ran recently — nothing to do."
          fi
