name: Daily Market Report

on:
  schedule:
    # 21:30 UTC == 06:30 JST the next day. Deliberately OFF the top of the hour:
    # GitHub's best-effort scheduler delays/skips crons most at :00 (the busiest
    # global slot), which is why the once-a-day 0 21 run kept getting dropped.
    # The watchdog (market_report_watchdog.yml) still guarantees delivery.
    - cron: '30 21 * * *'
  workflow_dispatch: # Allow manual trigger

permissions:
  actions: read      # guard job reads recent run history
  contents: read

jobs:
  # Dedup guard: when GitHub finally fires the (often 30-90 min late) scheduled
  # cron AFTER the watchdog has already dispatched and delivered today's report,
  # that late scheduled run would send a DUPLICATE. So a *scheduled* run skips
  # if a report already succeeded in the last 4h. Manual and watchdog dispatches
  # always run (the watchdog self-checks a 3h window before dispatching), so the
  # report is never suppressed — the guard only ever cancels a redundant re-send.
  guard:
    runs-on: ubuntu-latest
    outputs:
      proceed: ${{ steps.check.outputs.proceed }}
    steps:
      - name: Decide whether to run (skip a late scheduled duplicate)
        id: check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # Only the scheduled cron is deduped; everything else always runs.
          if [ "${{ github.event_name }}" != "schedule" ]; then
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "event=${{ github.event_name }} -> always run"
            exit 0
          fi
          gh run list --repo "${{ github.repository }}" --workflow="market_report.yml" \
            --json databaseId,createdAt,status,conclusion --limit 20 > /tmp/runs.json 2>/dev/null
          DUP=0
          if [ -s /tmp/runs.json ]; then
            CUTOFF=$(( $(date -u +%s) - 4*3600 ))
            DUP=$(jq -r --argjson me ${{ github.run_id }} --argjson cut "$CUTOFF" '
              [ .[]
                | select(.databaseId != $me)
                | select(.status=="completed" and .conclusion=="success")
                | (.createdAt | sub("\\.[0-9]+";"") | fromdateiso8601)
                | select(. > $cut) ] | length' /tmp/runs.json 2>/dev/null)
          fi
          [ -z "$DUP" ] && DUP=0
          # Fail-safe: any parse/API error leaves DUP=0 -> proceed=true (never
          # let a guard bug silently suppress the report).
          if [ "$DUP" -gt 0 ] 2>/dev/null; then
            echo "proceed=false" >> "$GITHUB_OUTPUT"
            echo "A report already succeeded in the last 4h -> skipping this late scheduled run."
          else
            echo "proceed=true" >> "$GITHUB_OUTPUT"
            echo "No recent successful report -> running."
          fi

  run-market-analysis:
    needs: guard
    if: ${{ needs.guard.outputs.proceed == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Analyzer Script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBSCRIBER_WORKER_URL: ${{ secrets.SUBSCRIBER_WORKER_URL }}
          SUBSCRIBER_WORKER_SECRET: ${{ secrets.SUBSCRIBER_WORKER_SECRET }}
        run: |
          python market_analyzer.py
