name: Daily Market Report

on:
  schedule:
    # 21:30 UTC == 06:30 JST the next day. Deliberately OFF the top of the hour:
    # GitHub's best-effort scheduler delays/skips crons most at :00 (the busiest
    # global slot), which is why the once-a-day 0 21 run kept getting dropped.
    # The watchdog (market_report_watchdog.yml) still guarantees delivery.
    - cron: '30 21 * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  run-market-analysis:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python 3.10
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Market Analyzer Script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          WORKER_URL: ${{ secrets.WORKER_URL }}
          SUBSCRIBER_WORKER_URL: ${{ secrets.SUBSCRIBER_WORKER_URL }}
          SUBSCRIBER_WORKER_SECRET: ${{ secrets.SUBSCRIBER_WORKER_SECRET }}
        run: |
          python market_analyzer.py
