name: JKK Vacancy Email Digest

on:
  schedule:
    # JST = UTC+9. GitHub cron runs in UTC.
    # Note: GitHub's scheduler is best-effort; runs can start a few minutes late.
    # Avoid exact top-of-hour crons — they are the most likely to be dropped under load.
    - cron: '35 0 * * *'   # 09:35 JST — JKK "golden time" (new vacancies land 9-10 AM)
    - cron: '3 2 * * *'    # 11:03 JST
    - cron: '30 5 * * *'   # 14:30 JST
    - cron: '20 9 * * *'   # 18:20 JST
  workflow_dispatch:
    # Allow manual trigger from GitHub Actions UI

jobs:
  send-digest:
    name: Scrape JKK Watcher & Send Email
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install mailer dependency
        run: npm install nodemailer@6 --no-save --no-package-lock

      - name: Run JKK vacancy digest
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: node scripts/jkk_email_watch.js
