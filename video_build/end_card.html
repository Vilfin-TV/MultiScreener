<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>end</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#0e1f3b 0%,#060f1c 55%,#030810 100%);font-family:'Segoe UI',Arial,sans-serif}
  .wrap{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}
  .logo{width:210px;height:210px;border-radius:50%;opacity:0;transform:scale(.6);animation:pop 1s cubic-bezier(.22,1.4,.36,1) .2s forwards;
    box-shadow:0 0 90px rgba(37,99,235,.5)}
  @keyframes pop{to{opacity:1;transform:scale(1)}}
  .t1{font-size:58px;font-weight:800;letter-spacing:4px;color:#fff;opacity:0;animation:rise .8s ease .7s forwards}
  .t1 span{color:#38bdf8}
  .t1 em{font-style:normal;font-weight:300;color:#f59e0b;letter-spacing:10px}
  .tag{font-size:22px;letter-spacing:6px;color:#8ea8c8;text-transform:uppercase;opacity:0;animation:rise .8s ease 1.1s forwards}
  .url{font-size:30px;font-weight:700;color:#93c5fd;letter-spacing:2px;opacity:0;animation:rise .8s ease 1.5s forwards}
  @keyframes rise{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
  .sub{margin-top:14px;padding:18px 54px;border-radius:50px;background:#cc0000;color:#fff;font-size:28px;font-weight:800;letter-spacing:2px;
    opacity:0;animation:rise .7s ease 2s forwards,pulse 1.6s ease 2.9s infinite}
  @keyframes pulse{0%,100%{transform:scale(1);box-shadow:0 0 0 rgba(204,0,0,.5)}50%{transform:scale(1.06);box-shadow:0 0 44px rgba(204,0,0,.55)}}
  .bell{display:inline-block;margin-left:12px}
</style>
</head>
<body>
<div class="wrap">
  <img class="logo" src="../images/vilfintv-logo.jpg" alt="">
  <div class="t1">Vilfin<span>TV</span> <em>NEWS</em></div>
  <div class="tag">Every headline · One place</div>
  <div class="url">vilfintv.com/news.html</div>
  <div class="sub">SUBSCRIBE <span class="bell">🔔</span></div>
</div>
</body>
</html>
