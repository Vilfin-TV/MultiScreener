<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VilfinTV — Draw / Stars / Fireworks</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden;background:#01040c;font-family:'Segoe UI',Arial,sans-serif}
  #stars,#fw{position:fixed;inset:0;width:100%;height:100%}
  #stars{z-index:1}
  #fw{z-index:2}
  .sky{position:fixed;inset:0;z-index:0;
    background:radial-gradient(ellipse 70% 70% at 50% 44%, #0a1933 0%, #050d20 45%, #01040c 100%)}

  .scene{position:fixed;inset:0;z-index:5;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px}

  /* Drawn V (SVG) */
  .draw{width:430px;height:430px;filter:drop-shadow(0 0 26px rgba(56,189,248,.35))}
  .arm{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:46}
  #redArm{stroke:url(#gRed);stroke-dasharray:185;stroke-dashoffset:185;
    animation:drawRed 3s cubic-bezier(.5,0,.5,1) 1s forwards}
  #orangeArm{stroke:url(#gOrange);stroke-dasharray:205;stroke-dashoffset:205;
    animation:drawOrange 2.7s cubic-bezier(.4,0,.6,1) 4s forwards}
  #arrowHead{fill:#fbbf24;opacity:0;transform-origin:350px 188px;
    animation:popArrow .5s cubic-bezier(.2,1.6,.4,1) 6.5s forwards}
  #drop{opacity:0;transform-origin:172px 175px;animation:popDrop .8s ease 0.5s forwards}
  @keyframes drawRed{to{stroke-dashoffset:0}}
  @keyframes drawOrange{to{stroke-dashoffset:0}}
  @keyframes popArrow{0%{opacity:0;transform:scale(.2)}100%{opacity:1;transform:scale(1)}}
  @keyframes popDrop{0%{opacity:0;transform:scale(.3)}100%{opacity:1;transform:scale(1)}}
  .draw{opacity:1;animation:drawnOut 1s ease 7.0s forwards}
  @keyframes drawnOut{to{opacity:0}}

  /* Real logo badge */
  .logo{position:absolute;width:340px;height:340px;border-radius:50%;
    opacity:0;transform:scale(.78);
    animation:logoIn 1.1s cubic-bezier(.2,1.3,.4,1) 6.9s forwards,
              shineGlow 4s ease-in-out 8s infinite}
  @keyframes logoIn{0%{opacity:0;transform:scale(.78)}100%{opacity:1;transform:scale(1)}}
  @keyframes shineGlow{0%,100%{box-shadow:0 0 55px 8px rgba(37,99,235,.4)}
    50%{box-shadow:0 0 95px 16px rgba(56,189,248,.6)}}

  .glint{position:absolute;width:340px;height:340px;border-radius:50%;overflow:hidden;z-index:6;pointer-events:none;opacity:0;
    animation:glintShow 0s linear 7.6s forwards}
  @keyframes glintShow{to{opacity:1}}
  .glint::before{content:'';position:absolute;top:-40%;left:-60%;width:50%;height:180%;
    background:linear-gradient(100deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(18deg);
    animation:glintSweep 5s ease-in-out 8.2s infinite}
  @keyframes glintSweep{0%{left:-60%}30%{left:140%}100%{left:140%}}

  /* completion bloom — also the brightest frame for audio sync */
  .bloom{position:fixed;inset:0;z-index:9;pointer-events:none;
    background:radial-gradient(circle at 50% 44%, #ffffff 0%, rgba(255,255,255,0) 42%);
    opacity:0;animation:bloom .55s ease-out 6.9s}
  @keyframes bloom{0%{opacity:0}30%{opacity:.97}100%{opacity:0}}

  .word{position:absolute;bottom:20%;z-index:7;font-size:72px;font-weight:800;letter-spacing:5px;color:#fff;
    opacity:0;transform:translateY(30px);animation:rise 1s cubic-bezier(.2,.85,.2,1) 24.0s forwards;
    text-shadow:0 4px 44px rgba(37,99,235,.7)}
  .word span{color:#38bdf8}
  .tag{position:absolute;bottom:15%;z-index:7;font-size:18px;font-weight:400;letter-spacing:10px;color:#9ec3ff;text-transform:uppercase;
    opacity:0;transform:translateY(22px);animation:rise 1s cubic-bezier(.2,.85,.2,1) 24.5s forwards}
  @keyframes rise{to{opacity:1;transform:none}}

  .endfade{position:fixed;inset:0;z-index:20;background:#000;opacity:0;animation:efade 1.6s ease-in 28.6s forwards}
  @keyframes efade{to{opacity:1}}
</style>
</head>
<body>
  <div class="sky"></div>
  <canvas id="stars"></canvas>
  <canvas id="fw"></canvas>

  <div class="scene">
    <svg class="draw" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="gRed" x1="190" y1="200" x2="256" y2="360" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#f43f5e"/><stop offset="1" stop-color="#9f1239"/>
        </linearGradient>
        <linearGradient id="gOrange" x1="256" y1="360" x2="350" y2="190" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#c2410c"/><stop offset="1" stop-color="#fbbf24"/>
        </linearGradient>
        <radialGradient id="gDrop" cx="50%" cy="40%" r="65%">
          <stop offset="0" stop-color="#e0f2fe"/><stop offset="0.5" stop-color="#38bdf8"/><stop offset="1" stop-color="#0369a1"/>
        </radialGradient>
      </defs>
      <path id="drop" d="M150 150 C176 150 196 168 196 192 C196 214 178 226 160 220 C150 216 146 206 146 196 C146 180 148 162 150 150 Z" fill="url(#gDrop)"/>
      <path id="redArm" class="arm" d="M190 200 L256 360"/>
      <path id="orangeArm" class="arm" d="M256 360 L350 190"/>
      <polygon id="arrowHead" points="318,176 372,150 360,210"/>
    </svg>

    <img class="logo" src="../images/vilfintv-logo.jpg" alt="">
    <div class="glint"></div>

    <div class="word">Vilfin<span>TV</span></div>
    <div class="tag">Markets · News · Stories · Academy</div>
  </div>

  <div class="bloom"></div>
  <div class="endfade"></div>

  <script>
    const t0 = performance.now();
    const T = () => (performance.now() - t0) / 1000;

    // ---- Starfield ----
    const sc = document.getElementById('stars'), sx = sc.getContext('2d');
    let W, H;
    function resize(){ W = sc.width = fw.width = innerWidth; H = sc.height = fwc.height = innerHeight; }
    const stars = [];
    function initStars(){
      stars.length = 0;
      const n = Math.round(W * H / 5200);
      for (let i = 0; i < n; i++) stars.push({
        x: Math.random()*W, y: Math.random()*H*0.92,
        r: Math.random()*1.6+0.4, ph: Math.random()*6.28, sp: Math.random()*2+0.6,
        c: Math.random()<0.15 ? '#9ec3ff' : (Math.random()<0.12 ? '#ffe6b0' : '#ffffff')
      });
    }

    // ---- Fireworks ----
    const fwc = document.getElementById('fw'), fx = fwc.getContext('2d');
    const parts = [];
    const COLORS = ['#38bdf8','#fbbf24','#f43f5e','#ffffff','#93c5fd','#fb923c'];
    const BURSTS = [18.5, 20.0, 21.5, 23.0, 24.8, 26.2];
    let fired = BURSTS.map(()=>false);
    function burst(cx, cy){
      const col = COLORS[Math.floor(Math.random()*COLORS.length)];
      const n = 90;
      for (let i=0;i<n;i++){
        const a = Math.PI*2*i/n + Math.random()*0.1;
        const sp = Math.random()*5+2.5;
        parts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp,
          life:1, col: Math.random()<0.2?'#ffffff':col, r:Math.random()*2+1.4});
      }
    }

    let W2=innerWidth;
    function loop(){
      const t = T();
      // stars
      sx.clearRect(0,0,W,H);
      const starAlpha = Math.max(0, Math.min(1, (t-6.8)/2));
      if (starAlpha>0){
        for (const s of stars){
          const tw = 0.45 + 0.55*Math.sin(t*s.sp + s.ph);
          sx.globalAlpha = starAlpha * tw;
          sx.fillStyle = s.c;
          sx.beginPath(); sx.arc(s.x,s.y,s.r,0,6.28); sx.fill();
          if (s.r>1.2){ sx.globalAlpha = starAlpha*tw*0.4; sx.beginPath(); sx.arc(s.x,s.y,s.r*2.4,0,6.28); sx.fill(); }
        }
        sx.globalAlpha = 1;
      }
      // fireworks
      fx.clearRect(0,0,W,H);
      BURSTS.forEach((bt,i)=>{
        if (!fired[i] && t>=bt){
          fired[i]=true;
          const cx = W*(0.25+Math.random()*0.5), cy = H*(0.18+Math.random()*0.28);
          burst(cx,cy);
          // a couple of bursts fire a quick double
          if (Math.random()<0.5) setTimeout(()=>burst(W*(0.25+Math.random()*0.5),H*(0.18+Math.random()*0.25)),220);
        }
      });
      for (let i=parts.length-1;i>=0;i--){
        const p=parts[i];
        p.vy+=0.045; p.vx*=0.985; p.vy*=0.985;
        p.x+=p.vx; p.y+=p.vy; p.life-=0.012;
        if (p.life<=0){ parts.splice(i,1); continue; }
        fx.globalAlpha = Math.max(0,p.life);
        fx.fillStyle = p.col;
        fx.beginPath(); fx.arc(p.x,p.y,p.r,0,6.28); fx.fill();
        fx.globalAlpha = Math.max(0,p.life)*0.5;
        fx.beginPath(); fx.arc(p.x,p.y,p.r*2.2,0,6.28); fx.fill();
      }
      fx.globalAlpha=1;
      requestAnimationFrame(loop);
    }
    resize(); initStars();
    addEventListener('resize',()=>{resize();initStars();});
    loop();
  </script>
</body>
</html>
