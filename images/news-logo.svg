<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VilfinTV News">
  <defs>
    <linearGradient id="vtvBadge" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#0e1f3b"/>
      <stop offset="1" stop-color="#0a1830"/>
    </linearGradient>
    <linearGradient id="vtvMark" x1="14" y1="46" x2="52" y2="12" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ef4444"/>
      <stop offset="0.6" stop-color="#f43f5e"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Premium navy badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#vtvBadge)" stroke="#1e3a5c" stroke-width="1.5"/>
  <rect x="2.75" y="2.75" width="58.5" height="58.5" rx="14.25" fill="none" stroke="#2563eb" stroke-width="1" stroke-opacity="0.18"/>

  <!-- "V" that reads as an upward market trendline -->
  <path d="M15 21 L28.5 44 L50 12.5" fill="none" stroke="url(#vtvMark)" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <!-- Trend arrowhead at the top of the rising arm -->
  <path d="M41.5 12.5 L50 12.5 L50 21" fill="none" stroke="#f59e0b" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Live-news spark -->
  <circle cx="15" cy="21" r="3.6" fill="#2563eb"/>
  <circle cx="15" cy="21" r="3.6" fill="#3b82f6" fill-opacity="0.5"/>
</svg>
