<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="VilfinTV">
  <defs>
    <radialGradient id="vtvBg" cx="50%" cy="40%" r="70%">
      <stop offset="0" stop-color="#152648"/>
      <stop offset="0.55" stop-color="#0d1a36"/>
      <stop offset="1" stop-color="#070e20"/>
    </radialGradient>
    <linearGradient id="vtvRim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3e5f96"/>
      <stop offset="0.45" stop-color="#16294a"/>
      <stop offset="1" stop-color="#2c4d80"/>
    </linearGradient>
    <linearGradient id="vtvRed" x1="170" y1="156" x2="254" y2="366" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f43f5e"/>
      <stop offset="0.6" stop-color="#dc2626"/>
      <stop offset="1" stop-color="#9f1239"/>
    </linearGradient>
    <linearGradient id="vtvOrange" x1="254" y1="366" x2="398" y2="148" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#c2410c"/>
      <stop offset="0.55" stop-color="#f97316"/>
      <stop offset="1" stop-color="#fbbf24"/>
    </linearGradient>
    <linearGradient id="vtvDrop" x1="110" y1="86" x2="162" y2="160" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#bae6fd"/>
      <stop offset="0.45" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Outer button -->
  <circle cx="256" cy="256" r="252" fill="#040a18"/>
  <circle cx="256" cy="256" r="246" fill="url(#vtvRim)"/>
  <circle cx="256" cy="256" r="228" fill="url(#vtvBg)" stroke="#0a1428" stroke-width="5"/>
  <!-- Inner glossy ring -->
  <circle cx="256" cy="256" r="212" fill="none" stroke="#4e7fc4" stroke-width="3" stroke-opacity="0.35"/>
  <circle cx="256" cy="256" r="206" fill="none" stroke="#0a1428" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Top sheen -->
  <ellipse cx="256" cy="118" rx="160" ry="52" fill="#ffffff" opacity="0.05"/>

  <!-- Blue droplet spark — slim comet tear, tip aimed down-right at the arm top -->
  <path d="M162 160 C144 158 112 146 106 122 C100 98 118 80 140 84 C162 88 168 110 164 132 C162 144 162 152 162 160 Z" fill="url(#vtvDrop)"/>
  <ellipse cx="120" cy="96" rx="10" ry="7" fill="#f0f9ff" opacity="0.9" transform="rotate(-28 120 96)"/>

  <!-- V left arm — tapered red ribbon slanting down-right, sharp fold at the base -->
  <path d="M148 182 Q160 152 188 158 L298 308 L254 366 Z" fill="url(#vtvRed)"/>
  <!-- fold shadow on the inner side of the vertex -->
  <path d="M254 366 L298 308 L262 318 Z" fill="#881337" opacity="0.55"/>

  <!-- V right arm — orange swoosh rising into an integrated barbed arrowhead -->
  <path d="M254 366 L298 308 Q318 250 330 193 L311 178 L398 148 L389 240 L370 225 Q310 320 254 366 Z" fill="url(#vtvOrange)"/>
</svg>
