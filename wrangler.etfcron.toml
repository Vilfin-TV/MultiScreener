# Cloudflare Worker: exact-time refresh trigger for ETF Momentum Mode data.
# Deployed automatically by .github/workflows/deploy_etf_cron.yml.
# Secret: GH_TOKEN (GitHub token with actions:write / workflow scope).

name = "etf-cron-trigger"
main = "etf_cron_worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

[triggers]
# UTC. IST = UTC+5:30. Still 4 cron triggers (the account is at the free-plan limit of 5):
#   "*/30 4-9 * * 1-5"      09:30–15:00 IST every 30 min → etf_intraday.yml (near-live chart bars)
#   "20,50 10,11 * * 1-5"   15:50–17:20 IST → etf_momentum.yml when behind (before 16:15 IST it
#                           finds the data up to date and does nothing)
#   "20 12,13,14 * * 1-5"   17:50, 18:50, 19:50 IST → etf_momentum.yml when behind
#   "40 2 * * 2-6"          08:10 IST Tue–Sat catch-up for the previous session
crons = ["*/30 4-9 * * 1-5", "20,50 10,11 * * 1-5", "20 12,13,14 * * 1-5", "40 2 * * 2-6"]
