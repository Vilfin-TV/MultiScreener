# Cloudflare Worker: exact-time refresh trigger for the India Mutual Fund Screener data.
# Deployed automatically by .github/workflows/deploy_mf_cron.yml.
# Secret: GH_TOKEN (GitHub token with actions:write / workflow scope).

name = "mf-screener-cron-trigger"
main = "mf_cron_worker.js"
compatibility_date = "2026-01-01"
workers_dev = false

[triggers]
# UTC. IST = UTC+5:30. 23:35 IST (same-evening NAVs), then 05:35, 06:05, 06:35,
# 07:35, 09:05 and 11:05 IST (early-morning refresh + late overseas FoF NAVs).
# The worker only dispatches when the published NAV date is behind.
crons = ["5 18 * * *", "5,35 0 * * *", "5 1,2 * * *", "35 3 * * *", "35 5 * * *"]
