<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="A colorful coral kingdom with polka-dot-hatted jellyfish, racing seahorses and a friendly octopus as Pip and Hoshi explore">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e5e84"/><stop offset="1" stop-color="#063a56"/></linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sea)"/>
  <g fill="#bfeaff" opacity="0.6"><circle cx="120" cy="90" r="6"/><circle cx="660" cy="110" r="7"/><circle cx="420" cy="70" r="5"/><circle cx="540" cy="150" r="4"/></g>
  <!-- coral on seabed -->
  <path d="M0 470 C200 450 420 470 800 456 L800 520 L0 520 Z" fill="#0a2f45"/>
  <g>
