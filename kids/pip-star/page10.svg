    <g fill="#ffd75e"><circle cx="160" cy="466" r="6"/><circle cx="180" cy="458" r="5"/><circle cx="640" cy="464" r="6"/></g>
  </g>
  <!-- jellyfish with polka-dot hats -->
  <g transform="translate(150,180)">
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="#ff9ec7" opacity="0.9"/>
    <path d="M-30 6 q6 30 -2 50 M-12 10 q4 34 -2 54 M8 10 q-4 34 2 54 M28 6 q-6 30 2 50" stroke="#ff9ec7" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M-22 -18 q22 -16 44 0 z" fill="#5b6cd0"/><g fill="#fff"><circle cx="-8" cy="-22" r="2.6"/><circle cx="8" cy="-24" r="2.4"/></g>
    <circle cx="-10" cy="0" r="3" fill="#3a2e2e"/><circle cx="10" cy="0" r="3" fill="#3a2e2e"/>
    <path d="M-6 8 q6 5 12 0" stroke="#3a2e2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(560,140) scale(0.8)">
    <ellipse cx="0" cy="0" rx="34" ry="26" fill="#8ad6e8" opacity="0.9"/>
    <path d="M-30 6 q6 30 -2 50 M-12 10 q4 34 -2 54 M8 10 q-4 34 2 54 M28 6 q-6 30 2 50" stroke="#8ad6e8" stroke-width="5" fill="none" stroke-linecap="round" opacity="0.85"/>
    <path d="M-22 -18 q22 -16 44 0 z" fill="#e86b8a"/><g fill="#fff"><circle cx="-8" cy="-22" r="2.6"/><circle cx="8" cy="-24" r="2.4"/></g>
    <circle cx="-10" cy="0" r="3" fill="#3a2e2e"/><circle cx="10" cy="0" r="3" fill="#3a2e2e"/>
    <path d="M-6 8 q6 5 12 0" stroke="#3a2e2e" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- racing seahorses -->
  <g transform="translate(360,330)" fill="#ffb15a">
    <path d="M0 0 q-14 -10 -10 -28 q2 -16 16 -18 q16 -2 18 14 q-10 -4 -16 4 q-6 8 0 18 q4 8 -8 10 z"/>
    <circle cx="6" cy="-40" r="3" fill="#3a2e2e"/>
  </g>
  <g transform="translate(330,360) scale(0.8)" fill="#ff8c6b">
    <path d="M0 0 q-14 -10 -10 -28 q2 -16 16 -18 q16 -2 18 14 q-10 -4 -16 4 q-6 8 0 18 q4 8 -8 10 z"/>
    <circle cx="6" cy="-40" r="3" fill="#3a2e2e"/>
  </g>
  <!-- friendly octopus waving -->
  <g transform="translate(640,330)">
    <ellipse cx="0" cy="0" rx="44" ry="40" fill="#b07ce0"/>
