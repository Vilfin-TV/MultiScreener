<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="A glowing baby star lying upside-down in a mushroom patch while a surprised fox leans in">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1c3a"/><stop offset="1" stop-color="#214a4e"/></linearGradient>
    <radialGradient id="g2" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <g fill="#fdf6d8"><circle cx="120" cy="60" r="2"/><circle cx="300" cy="90" r="1.5"/><circle cx="560" cy="70" r="1.8"/><circle cx="700" cy="110" r="1.5"/><circle cx="640" cy="50" r="1.6"/></g>
  <!-- falling streak -->
  <path d="M560 40 C540 120 500 180 470 250" stroke="#fff0b0" stroke-width="3" fill="none" opacity="0.5" stroke-dasharray="2 8" stroke-linecap="round"/>
  <!-- ground -->
  <path d="M0 400 C200 372 380 396 540 392 C660 388 720 396 800 392 L800 520 L0 520 Z" fill="#143436"/>
  <path d="M0 460 C220 442 420 466 800 460 L800 520 L0 520 Z" fill="#0f2628"/>
  <!-- mushrooms -->
  <g>
    <rect x="252" y="404" width="14" height="36" rx="7" fill="#f3e7cf"/><ellipse cx="259" cy="404" rx="34" ry="20" fill="#e0584f"/><g fill="#fff"><circle cx="245" cy="400" r="4"/><circle cx="270" cy="396" r="3.5"/><circle cx="262" cy="408" r="3"/></g>
    <rect x="540" y="410" width="12" height="30" rx="6" fill="#f3e7cf"/><ellipse cx="546" cy="410" rx="28" ry="16" fill="#e0584f"/><g fill="#fff"><circle cx="536" cy="407" r="3.5"/><circle cx="556" cy="404" r="3"/></g>
    <rect x="610" y="416" width="10" height="26" rx="5" fill="#f3e7cf"/><ellipse cx="615" cy="416" rx="22" ry="13" fill="#e8736b"/><g fill="#fff"><circle cx="608" cy="414" r="3"/><circle cx="622" cy="412" r="2.5"/></g>
  </g>
  <!-- star upside-down in patch with glow -->
  <g transform="translate(420,400)"><circle cx="0" cy="0" r="50" fill="url(#g2)"/>
    <g transform="rotate(180)">
      <path d="M0 -30 L9 -9 L32 -9 L13 5 L20 28 L0 14 L-20 28 L-13 5 L-32 -9 L-9 -9 Z" fill="#FFD75E"/>
      <ellipse cx="-8" cy="-2" rx="4" ry="5" fill="#3A2E2E"/><ellipse cx="8" cy="-2" rx="4" ry="5" fill="#3A2E2E"/>
      <circle cx="-13" cy="6" r="3.4" fill="#FF9DB0"/><circle cx="13" cy="6" r="3.4" fill="#FF9DB0"/>
      <path d="M-5 7 q5 4 10 0" stroke="#3A2E2E" stroke-width="1.8" fill="none" stroke-linecap="round"/>
    </g>
  </g>

  <!-- surprised Pip leaning in from the right -->
  <g transform="translate(470,288) scale(0.95)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <path d="M30 90 C12 86 8 66 24 70 C22 80 24 86 34 92 Z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/><ellipse cx="96" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="74" rx="6" ry="5" fill="#3A2E2E"/>
    <!-- wide surprised eyes -->
    <circle cx="66" cy="52" r="8" fill="#fff"/><circle cx="94" cy="52" r="8" fill="#fff"/>
    <circle cx="67" cy="53" r="4.5" fill="#3A2E2E"/><circle cx="95" cy="53" r="4.5" fill="#3A2E2E"/>
    <!-- raised brows -->
    <path d="M58 38 q8 -5 16 -2" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M86 36 q8 -3 16 2" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- exclamation -->
  <g transform="translate(596,250)" fill="#ffe27a"><rect x="-3" y="0" width="7" height="20" rx="3"/><circle cx="0.5" cy="28" r="4"/></g>
</svg>
