<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="A shy little moon-mole in a dark crater hugging glowing starlight while kind Pip offers to share the light">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#120e36"/><stop offset="1" stop-color="#241a44"/></linearGradient>
    <radialGradient id="craterGlow" cx="0.5" cy="0.4" r="0.6"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.85"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
    <linearGradient id="crater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#6f7796"/><stop offset="1" stop-color="#3e4564"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#space)"/>
  <g fill="#fff"><circle cx="80" cy="60" r="1.6"/><circle cx="260" cy="50" r="1.4"/><circle cx="540" cy="70" r="1.5"/><circle cx="720" cy="50" r="1.6"/><circle cx="150" cy="130" r="1.3"/><circle cx="650" cy="140" r="1.4"/></g>
  <!-- crater bowl -->
  <ellipse cx="400" cy="440" rx="360" ry="120" fill="url(#crater)"/>
  <ellipse cx="400" cy="430" rx="250" ry="80" fill="#2c3150"/>
  <!-- starlight glow from the mole's bundle -->
  <circle cx="430" cy="390" r="90" fill="url(#craterGlow)"/>
  <!-- moon-mole hugging starlight -->
  <g transform="translate(430,360)">
    <ellipse cx="0" cy="40" rx="40" ry="36" fill="#6b5a7a"/>
    <ellipse cx="0" cy="30" rx="26" ry="24" fill="#8a7799"/>
    <!-- big shovel paws hugging bundle -->
    <ellipse cx="-22" cy="50" rx="12" ry="9" fill="#5a4a68"/><ellipse cx="22" cy="50" rx="12" ry="9" fill="#5a4a68"/>
    <!-- pink nose -->
    <ellipse cx="0" cy="38" rx="7" ry="5" fill="#f4a6c0"/>
    <!-- shy closed eyes -->
    <path d="M-14 26 q5 4 10 0 M4 26 q5 4 10 0" stroke="#2a2238" stroke-width="2.4" fill="none" stroke-linecap="round"/>
    <!-- starlight bundle -->
    <g transform="translate(0,52) scale(0.5)">
      <path d="M0 -28 L8 -8 L30 -8 L12 5 L19 26 L0 13 L-19 26 L-12 5 L-30 -8 L-8 -8 Z" fill="#FFD75E"/>
    </g>
  </g>
  <!-- kind Pip offering, on crater rim left -->
  <g transform="translate(120,290) scale(0.95)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <!-- extended right arm offering -->
    <ellipse cx="124" cy="116" rx="13" ry="10" fill="#F4733A" transform="rotate(18 124 116)"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <!-- kind soft eyes + smile -->
    <path d="M60 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M86 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="66" r="5" fill="#FF9DB0" opacity="0.6"/><circle cx="102" cy="66" r="5" fill="#FF9DB0" opacity="0.6"/>
  </g>
</svg>
