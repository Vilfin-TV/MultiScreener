<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip the fox rising in a basket lifted by glowing paper lanterns through pink cherry blossoms into a starry sky">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#16143a"/><stop offset="0.6" stop-color="#23315c"/><stop offset="1" stop-color="#3b5a7a"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <g fill="#fdf6d8"><circle cx="90" cy="60" r="2.2"/><circle cx="200" cy="40" r="1.6"/><circle cx="320" cy="90" r="2"/><circle cx="560" cy="50" r="1.8"/><circle cx="660" cy="100" r="2"/><circle cx="740" cy="50" r="1.6"/><circle cx="120" cy="160" r="1.4"/><circle cx="700" cy="200" r="1.4"/></g>
  <!-- drifting blossoms -->
  <g fill="#ffc6dd" opacity="0.9"><circle cx="160" cy="300" r="7"/><circle cx="620" cy="260" r="6"/><circle cx="520" cy="380" r="7"/><circle cx="240" cy="420" r="6"/><circle cx="700" cy="360" r="6"/><circle cx="380" cy="120" r="6"/></g>
  <g fill="#ffe2ee"><circle cx="160" cy="300" r="2.6"/><circle cx="620" cy="260" r="2.4"/><circle cx="520" cy="380" r="2.6"/></g>
  <!-- cluster of lanterns -->
  <g>
    <circle cx="360" cy="120" r="20" fill="#ff8c42"/><circle cx="360" cy="120" r="30" fill="#ff8c42" opacity="0.25" filter="url(#soft)"/>
    <circle cx="420" cy="100" r="17" fill="#ffb15a"/><circle cx="420" cy="100" r="26" fill="#ffb15a" opacity="0.25" filter="url(#soft)"/>
    <circle cx="470" cy="135" r="16" fill="#ff7b3a"/><circle cx="470" cy="135" r="24" fill="#ff7b3a" opacity="0.25" filter="url(#soft)"/>
    <circle cx="320" cy="150" r="14" fill="#ffa64d"/>
    <circle cx="430" cy="160" r="13" fill="#ff9647"/>
    <!-- strings to basket -->
    <g stroke="#d8b87a" stroke-width="1.4"><line x1="360" y1="140" x2="392" y2="300"/><line x1="420" y1="117" x2="408" y2="300"/><line x1="470" y1="151" x2="420" y2="300"/><line x1="320" y1="164" x2="392" y2="300"/></g>
  </g>
  <!-- basket -->
  <path d="M380 300 h60 l-8 60 h-44 z" fill="#a9743b"/>
  <path d="M380 300 h60 l-2 14 h-56 z" fill="#c2894a"/>
  <g stroke="#8a5e2e" stroke-width="2" opacity="0.5"><line x1="392" y1="314" x2="388" y2="356"/><line x1="410" y1="314" x2="410" y2="356"/><line x1="428" y1="314" x2="432" y2="356"/></g>
  <!-- Pip peeking out of basket -->
  <g transform="translate(330,205) scale(0.85)">
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
    <!-- little arms gripping basket edge -->
    <ellipse cx="52" cy="104" rx="12" ry="9" fill="#F4733A"/><ellipse cx="108" cy="104" rx="12" ry="9" fill="#F4733A"/>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <!-- happy excited eyes -->
    <path d="M60 50 q6 -8 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M86 50 q6 -8 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <circle cx="58" cy="66" r="5" fill="#FF9DB0" opacity="0.7"/><circle cx="102" cy="66" r="5" fill="#FF9DB0" opacity="0.7"/>
  </g>
  <!-- scarf holding Hoshi -->
  <g transform="translate(452,250) scale(0.5)"><circle cx="0" cy="0" r="40" fill="#ffe9a8" opacity="0.6"/>
    <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
    <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    <path d="M-6 8 q6 6 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- treetops far below -->
  <g fill="#1c4a40" opacity="0.8"><ellipse cx="80" cy="520" rx="90" ry="40"/><ellipse cx="300" cy="525" rx="120" ry="38"/><ellipse cx="560" cy="522" rx="110" ry="42"/><ellipse cx="760" cy="525" rx="90" ry="36"/></g>
</svg>
