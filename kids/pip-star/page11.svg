<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="An enormous gentle whale sleeping on the glowing ocean floor with a bright star under her fin as tiny Pip sings to wake her">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0d5274"/><stop offset="1" stop-color="#052f47"/></linearGradient>
    <radialGradient id="finGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sea)"/>
  <g fill="#bfeaff" opacity="0.6"><circle cx="120" cy="90" r="6"/><circle cx="300" cy="60" r="4"/><circle cx="640" cy="110" r="6"/><circle cx="540" cy="70" r="4"/></g>
  <g fill="#bfe9ff" opacity="0.1"><polygon points="160,0 260,0 200,520 100,520"/><polygon points="520,0 620,0 580,520 460,520"/></g>
  <!-- seabed -->
  <path d="M0 440 C200 410 420 440 800 420 L800 520 L0 520 Z" fill="#08334b"/>
  <g><path d="M60 440 q-8 -40 6 -60 q12 22 4 60 z" fill="#7fd8b0"/><path d="M740 440 q10 -44 -6 -64 q-14 24 -6 64 z" fill="#c79bf0"/></g>
  <!-- sleeping whale -->
  <g transform="translate(400,360)">
    <path d="M-260 20 C-220 -70 220 -70 260 20 C220 70 -220 70 -260 20 Z" fill="#5b8fb0"/>
    <path d="M-260 20 C-200 60 200 60 260 20 C200 56 -200 56 -260 20 Z" fill="#cfe6f0"/>
    <!-- tail -->
    <path d="M250 10 q60 -34 70 -54 q-10 40 -20 50 q22 6 30 -8 q-6 30 -40 26 z" fill="#5b8fb0"/>
    <!-- closed sleepy eye -->
    <path d="M-150 8 q14 8 28 0" stroke="#2a4a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- gentle smile -->
    <path d="M-200 26 q26 16 54 8" stroke="#2a4a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- fin with star tucked under -->
    <path d="M70 36 q40 36 96 30 q-30 -50 -96 -30 z" fill="#4f82a3"/>
    <g transform="translate(120,52) scale(0.55)"><circle cx="0" cy="0" r="46" fill="url(#finGlow)"/>
      <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
      <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    </g>
    <!-- zzz -->
    <text x="-150" y="-60" font-size="26" fill="#cfe6f0">z</text><text x="-120" y="-84" font-size="18" fill="#cfe6f0">z</text>
  </g>
  <!-- tiny Pip singing -->
  <g transform="translate(120,330) scale(0.62)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/><ellipse cx="96" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
    <path d="M64 60 q16 30 32 0 q-16 16 -32 0 z" fill="#FFF1E0"/>
    <!-- singing open mouth -->
    <ellipse cx="80" cy="78" rx="7" ry="9" fill="#7a3b3b"/>
    <ellipse cx="80" cy="66" rx="5" ry="4" fill="#3A2E2E"/>
    <path d="M60 50 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M86 50 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- music notes -->
  <g fill="#fff0a6"><g transform="translate(190,250)"><circle cx="0" cy="10" r="5"/><rect x="4" y="-12" width="3" height="22"/></g>
    <g transform="translate(230,210)"><circle cx="0" cy="10" r="4"/><rect x="3" y="-8" width="2.6" height="18"/></g></g>
</svg>
