<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip the fox sitting on a mossy rock in a glowing forest of lanterns and fireflies">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0c1c3a"/><stop offset="1" stop-color="#1c4a52"/></linearGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <g fill="#fdf6d8"><circle cx="100" cy="60" r="2"/><circle cx="220" cy="100" r="1.5"/><circle cx="500" cy="70" r="1.8"/><circle cx="640" cy="120" r="1.5"/><circle cx="730" cy="60" r="2"/></g>
  <!-- tall trees -->
  <g>
    <rect x="70" y="120" width="22" height="320" rx="10" fill="#143a3a"/><ellipse cx="81" cy="120" rx="60" ry="80" fill="#1c5247"/>
    <rect x="690" y="100" width="26" height="340" rx="12" fill="#143a3a"/><ellipse cx="703" cy="100" rx="72" ry="92" fill="#1c5247"/>
    <rect x="360" y="150" width="18" height="300" rx="9" fill="#11332f"/><ellipse cx="369" cy="150" rx="48" ry="64" fill="#184840"/>
  </g>
  <!-- lanterns -->
  <g><line x1="250" y1="0" x2="250" y2="60" stroke="#caa86a" stroke-width="1.5"/><circle cx="250" cy="76" r="14" fill="#ff8c42"/><circle cx="250" cy="76" r="22" fill="#ff8c42" opacity="0.25" filter="url(#soft)"/>
     <line x1="560" y1="0" x2="560" y2="48" stroke="#caa86a" stroke-width="1.5"/><circle cx="560" cy="62" r="12" fill="#ffb15a"/><circle cx="560" cy="62" r="20" fill="#ffb15a" opacity="0.25" filter="url(#soft)"/></g>
  <!-- ground -->
  <path d="M0 410 C200 380 380 405 540 400 C660 396 720 405 800 400 L800 520 L0 520 Z" fill="#123034"/>
  <path d="M0 470 C220 450 420 475 560 468 L800 470 L800 520 L0 520 Z" fill="#0e2428"/>
  <!-- mossy rock -->
  <ellipse cx="400" cy="430" rx="120" ry="42" fill="#3a4a3a"/>
  <ellipse cx="400" cy="420" rx="118" ry="34" fill="#46603f"/>
  <g fill="#5f8a4c"><ellipse cx="330" cy="412" rx="22" ry="9"/><ellipse cx="450" cy="410" rx="26" ry="10"/><ellipse cx="400" cy="404" rx="20" ry="8"/></g>
  <!-- fireflies -->
  <g fill="#fff0a6"><circle cx="180" cy="330" r="2.6"/><circle cx="610" cy="300" r="2.6"/><circle cx="520" cy="360" r="2"/><circle cx="260" cy="380" r="2"/><circle cx="660" cy="380" r="2.4"/><circle cx="150" cy="280" r="1.8"/></g>

  <!-- Pip sitting on the rock -->
  <g transform="translate(322,300) scale(1.0)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <path d="M30 90 C12 86 8 66 24 70 C22 80 24 86 34 92 Z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/><ellipse cx="96" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/><path d="M120 4 q17 0 30 6" stroke="#4E9E55" stroke-width="2" fill="none"/></g>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <ellipse cx="66" cy="52" rx="6" ry="7" fill="#3A2E2E"/><ellipse cx="94" cy="52" rx="6" ry="7" fill="#3A2E2E"/>
    <circle cx="68" cy="49" r="2" fill="#fff"/><circle cx="96" cy="49" r="2" fill="#fff"/>
  </g>
</svg>
