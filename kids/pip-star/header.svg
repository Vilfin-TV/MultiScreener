<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip the fox cradling a glowing baby star in a lantern-lit forest at night">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1733"/><stop offset="0.55" stop-color="#13314f"/><stop offset="1" stop-color="#1d4a55"/>
    </linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff7df"/><stop offset="1" stop-color="#ffe9a8"/>
    </radialGradient>
    <radialGradient id="hoshiGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <!-- stars -->
  <g fill="#fdf6d8">
    <circle cx="90" cy="70" r="2.2"/><circle cx="160" cy="120" r="1.6"/><circle cx="240" cy="60" r="2"/><circle cx="330" cy="110" r="1.4"/>
    <circle cx="520" cy="80" r="1.8"/><circle cx="610" cy="140" r="1.5"/><circle cx="700" cy="70" r="2.2"/><circle cx="760" cy="150" r="1.6"/>
    <circle cx="430" cy="50" r="1.4"/><circle cx="60" cy="180" r="1.4"/>
  </g>
  <!-- moon -->
  <circle cx="680" cy="110" r="54" fill="url(#moon)"/>
  <circle cx="662" cy="98" r="10" fill="#f4dca0" opacity="0.6"/><circle cx="700" cy="125" r="7" fill="#f4dca0" opacity="0.5"/>
  <!-- cherry blossom branch top-left -->
  <path d="M0 40 C70 60 120 30 200 70" stroke="#5a3b2e" stroke-width="7" fill="none" stroke-linecap="round"/>
  <g fill="#ffc6dd">
    <circle cx="60" cy="48" r="9"/><circle cx="110" cy="44" r="8"/><circle cx="150" cy="56" r="9"/><circle cx="190" cy="66" r="7"/><circle cx="30" cy="60" r="7"/>
  </g>
  <g fill="#ffe2ee"><circle cx="60" cy="48" r="3.5"/><circle cx="110" cy="44" r="3"/><circle cx="150" cy="56" r="3.5"/></g>
  <!-- hanging paper lanterns -->
  <g>
    <line x1="300" y1="0" x2="300" y2="40" stroke="#caa86a" stroke-width="1.5"/><circle cx="300" cy="55" r="16" fill="#ff8c42"/><circle cx="300" cy="55" r="24" fill="#ff8c42" opacity="0.25" filter="url(#soft)"/>
    <line x1="380" y1="0" x2="380" y2="64" stroke="#caa86a" stroke-width="1.5"/><circle cx="380" cy="80" r="13" fill="#ffb15a"/><circle cx="380" cy="80" r="20" fill="#ffb15a" opacity="0.25" filter="url(#soft)"/>
    <line x1="470" y1="0" x2="470" y2="40" stroke="#caa86a" stroke-width="1.5"/><circle cx="470" cy="54" r="15" fill="#ff7b3a"/><circle cx="470" cy="54" r="22" fill="#ff7b3a" opacity="0.25" filter="url(#soft)"/>
  </g>
  <!-- ground hills -->
  <path d="M0 430 C160 390 300 420 420 420 C560 420 680 395 800 430 L800 520 L0 520 Z" fill="#12303a"/>
  <path d="M0 470 C200 440 360 470 520 465 C650 461 720 470 800 460 L800 520 L0 520 Z" fill="#0e2630"/>
  <!-- fireflies -->
  <g fill="#fff0a6"><circle cx="150" cy="380" r="2.4"/><circle cx="600" cy="360" r="2.4"/><circle cx="540" cy="420" r="2"/><circle cx="230" cy="430" r="2"/><circle cx="690" cy="410" r="2.2"/></g>

  <!-- Pip cradling Hoshi -->
  <g transform="translate(330,250) scale(1.25)">
    <!-- glow behind star -->
    <circle cx="80" cy="108" r="46" fill="url(#hoshiGlow)"/>
    <!-- tail -->
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <path d="M30 90 C12 86 8 66 24 70 C22 80 24 86 34 92 Z" fill="#FFF1E0"/>
    <!-- body -->
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/>
    <ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/><ellipse cx="96" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <!-- head -->
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/>
    <path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <!-- leaf -->
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/><path d="M120 4 q17 0 30 6" stroke="#4E9E55" stroke-width="2" fill="none"/></g>
    <!-- face -->
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <ellipse cx="66" cy="52" rx="6" ry="7" fill="#3A2E2E"/><ellipse cx="94" cy="52" rx="6" ry="7" fill="#3A2E2E"/>
    <circle cx="68" cy="49" r="2" fill="#fff"/><circle cx="96" cy="49" r="2" fill="#fff"/>
    <!-- star Hoshi cradled -->
    <g transform="translate(80,108) scale(0.9)">
      <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
      <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
      <circle cx="-7.5" cy="-4" r="1.6" fill="#fff"/><circle cx="10.5" cy="-4" r="1.6" fill="#fff"/>
      <circle cx="-15" cy="7" r="4" fill="#FF9DB0" opacity="0.85"/><circle cx="15" cy="7" r="4" fill="#FF9DB0" opacity="0.85"/>
      <path d="M-6 8 q6 6 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
