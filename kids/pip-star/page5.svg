<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip and Hoshi floating in colorful outer space among planets and comets, looking at a star map with some stars gone dark">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1148"/><stop offset="0.5" stop-color="#2a1a5e"/><stop offset="1" stop-color="#3a1f63"/></linearGradient>
    <radialGradient id="pl1" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#ff9f6e"/><stop offset="1" stop-color="#d65a4a"/></radialGradient>
    <radialGradient id="pl2" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#7fd8e8"/><stop offset="1" stop-color="#3a86c0"/></radialGradient>
    <radialGradient id="pl3" cx="0.4" cy="0.35" r="0.7"><stop offset="0" stop-color="#c9a6f0"/><stop offset="1" stop-color="#8a5fd6"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#space)"/>
  <g fill="#fff"><circle cx="60" cy="60" r="1.8"/><circle cx="160" cy="120" r="1.3"/><circle cx="260" cy="50" r="1.6"/><circle cx="700" cy="60" r="1.8"/><circle cx="760" cy="160" r="1.4"/><circle cx="120" cy="260" r="1.4"/><circle cx="60" cy="420" r="1.6"/><circle cx="740" cy="420" r="1.5"/><circle cx="400" cy="40" r="1.4"/></g>
  <!-- planets -->
  <circle cx="120" cy="150" r="46" fill="url(#pl1)"/>
  <g transform="translate(680,360)"><circle r="40" fill="url(#pl3)"/><ellipse cx="0" cy="0" rx="62" ry="16" fill="none" stroke="#d9c2f5" stroke-width="6" opacity="0.8" transform="rotate(-18)"/></g>
  <circle cx="640" cy="120" r="22" fill="url(#pl2)"/>
  <!-- comet leapfrog -->
  <g><circle cx="220" cy="430" r="10" fill="#ffe27a"/><path d="M220 430 q-40 8 -80 30" stroke="#ffe27a" stroke-width="5" fill="none" opacity="0.5" stroke-linecap="round"/></g>
  <!-- Star Map (floating board) with some dark stars -->
  <g transform="translate(470,210)">
    <rect x="-10" y="-10" width="240" height="150" rx="14" fill="#241a4e" stroke="#6b54a8" stroke-width="3"/>
    <!-- constellation lines -->
    <path d="M20 40 L70 20 L120 55 L175 30 L205 70" stroke="#5b86c9" stroke-width="2" fill="none" opacity="0.7"/>
    <path d="M30 110 L90 90 L150 115 L200 95" stroke="#5b86c9" stroke-width="2" fill="none" opacity="0.7"/>
    <!-- lit stars -->
    <g fill="#ffe27a"><circle cx="20" cy="40" r="5"/><circle cx="175" cy="30" r="5"/><circle cx="90" cy="90" r="5"/><circle cx="200" cy="95" r="4"/></g>
    <!-- dark (out) stars -->
    <g fill="none" stroke="#5b4e86" stroke-width="2"><circle cx="70" cy="20" r="5"/><circle cx="120" cy="55" r="5"/><circle cx="205" cy="70" r="5"/><circle cx="30" cy="110" r="5"/><circle cx="150" cy="115" r="5"/></g>
  </g>

  <!-- Pip floating -->
  <g transform="translate(150,300) scale(0.92)">
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="50" cy="120" rx="11" ry="14" fill="#F4733A" transform="rotate(-20 50 120)"/>
    <ellipse cx="112" cy="120" rx="11" ry="14" fill="#F4733A" transform="rotate(20 112 120)"/>
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <circle cx="66" cy="52" r="7" fill="#fff"/><circle cx="94" cy="52" r="7" fill="#fff"/>
    <circle cx="67" cy="53" r="4" fill="#3A2E2E"/><circle cx="95" cy="53" r="4" fill="#3A2E2E"/>
  </g>
  <!-- Hoshi beside, pointing -->
  <g transform="translate(330,250) scale(0.7)"><circle cx="0" cy="0" r="42" fill="#ffe9a8" opacity="0.55"/>
    <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
    <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    <circle cx="-15" cy="7" r="4" fill="#FF9DB0"/><circle cx="15" cy="7" r="4" fill="#FF9DB0"/>
    <path d="M-6 8 q6 6 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
