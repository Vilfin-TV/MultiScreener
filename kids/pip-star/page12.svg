<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="A great friendly whale flying through a starry night sky carrying Pip while Hoshi lights up the constellations above the forest">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1330"/><stop offset="0.6" stop-color="#172a55"/><stop offset="1" stop-color="#26406e"/></linearGradient>
    <radialGradient id="moon" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff7df"/><stop offset="1" stop-color="#ffe9a8"/></radialGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sky)"/>
  <!-- relit constellation: lines + bright stars -->
  <g stroke="#6f8fd0" stroke-width="1.6" opacity="0.6" fill="none"><path d="M120 80 L200 60 L270 100 L350 70 L430 110"/><path d="M560 70 L640 100 L720 70"/></g>
  <g fill="#fff3b0"><circle cx="120" cy="80" r="4"/><circle cx="200" cy="60" r="4.5"/><circle cx="270" cy="100" r="4"/><circle cx="350" cy="70" r="4.5"/><circle cx="430" cy="110" r="4"/><circle cx="560" cy="70" r="4"/><circle cx="640" cy="100" r="4.5"/><circle cx="720" cy="70" r="4"/></g>
  <g fill="#fff"><circle cx="80" cy="150" r="1.6"/><circle cx="300" cy="160" r="1.4"/><circle cx="500" cy="150" r="1.6"/><circle cx="760" cy="160" r="1.5"/></g>
  <!-- moon -->
  <circle cx="700" cy="180" r="40" fill="url(#moon)"/>
  <!-- Hoshi lighting them, top -->
  <g transform="translate(470,150) scale(0.7)"><circle cx="0" cy="0" r="50" fill="url(#hglow)"/>
    <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
    <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    <circle cx="-15" cy="7" r="4" fill="#FF9DB0"/><circle cx="15" cy="7" r="4" fill="#FF9DB0"/>
    <path d="M-6 8 q6 6 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- sparkle trail from Hoshi to stars -->
  <g fill="#fff7c8"><circle cx="420" cy="120" r="2"/><circle cx="380" cy="100" r="1.6"/><circle cx="500" cy="110" r="1.8"/></g>

  <!-- flying whale carrying Pip -->
  <g transform="translate(330,330)">
    <path d="M-200 16 C-170 -54 170 -54 200 16 C170 56 -170 56 -200 16 Z" fill="#5b8fb0"/>
    <path d="M-200 16 C-150 48 150 48 200 16 C150 44 -150 44 -200 16 Z" fill="#cfe6f0"/>
    <path d="M192 8 q48 -28 56 -44 q-8 32 -16 40 q18 4 24 -6 q-4 24 -32 20 z" fill="#5b8fb0"/>
    <!-- happy eye -->
    <path d="M-120 6 q12 8 24 0" stroke="#2a4a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M-150 22 q22 14 46 6" stroke="#2a4a5e" stroke-width="3" fill="none" stroke-linecap="round"/>
    <!-- little side fin -->
    <path d="M40 30 q26 22 60 18 q-18 -32 -60 -18 z" fill="#4f82a3"/>
    <!-- Pip riding on top -->
    <g transform="translate(-40,-86) scale(0.6)">
      <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
      <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
      <!-- arms up cheering -->
      <ellipse cx="46" cy="86" rx="11" ry="14" fill="#F4733A" transform="rotate(-30 46 86)"/>
      <ellipse cx="114" cy="86" rx="11" ry="14" fill="#F4733A" transform="rotate(30 114 86)"/>
      <circle cx="80" cy="56" r="40" fill="#F4733A"/>
      <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
      <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
      <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
      <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
      <path d="M64 60 q16 30 32 0 q-16 16 -32 0 z" fill="#FFF1E0"/>
      <ellipse cx="80" cy="78" rx="6" ry="7" fill="#7a3b3b"/>
      <path d="M60 50 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M86 50 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <circle cx="58" cy="66" r="5" fill="#FF9DB0" opacity="0.7"/><circle cx="102" cy="66" r="5" fill="#FF9DB0" opacity="0.7"/>
    </g>
  </g>
  <!-- forest treetops far below -->
  <g fill="#12302a"><ellipse cx="80" cy="520" rx="90" ry="44"/><ellipse cx="280" cy="525" rx="120" ry="40"/><ellipse cx="520" cy="520" rx="110" ry="46"/><ellipse cx="740" cy="525" rx="100" ry="40"/></g>
  <g><line x1="180" y1="470" x2="180" y2="500" stroke="#caa86a" stroke-width="1.2"/><circle cx="180" cy="468" r="7" fill="#ff9647"/>
     <line x1="600" y1="476" x2="600" y2="504" stroke="#caa86a" stroke-width="1.2"/><circle cx="600" cy="474" r="6" fill="#ffb15a"/></g>
</svg>
