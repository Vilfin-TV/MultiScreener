<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip following a trail of sparkly crumbs across the moon past a sleepy space walrus and a playful comet-cat">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#171141"/><stop offset="1" stop-color="#2c2050"/></linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6e8"/><stop offset="1" stop-color="#9aa3bf"/></linearGradient>
  </defs>
  <rect width="800" height="520" fill="url(#space)"/>
  <g fill="#fff"><circle cx="80" cy="60" r="1.6"/><circle cx="220" cy="40" r="1.4"/><circle cx="420" cy="60" r="1.6"/><circle cx="600" cy="40" r="1.4"/><circle cx="720" cy="80" r="1.6"/><circle cx="150" cy="120" r="1.3"/></g>
  <g fill="#ffe27a"><circle cx="120" cy="90" r="3.2"/><circle cx="520" cy="70" r="3"/><circle cx="690" cy="130" r="3"/></g>
  <!-- moon surface -->
  <path d="M0 300 C200 250 400 270 600 255 C700 248 760 258 800 252 L800 520 L0 520 Z" fill="url(#moon)"/>
  <g fill="#8b94b0" opacity="0.7"><ellipse cx="140" cy="360" rx="30" ry="12"/><ellipse cx="430" cy="330" rx="24" ry="10"/><ellipse cx="660" cy="380" rx="34" ry="13"/></g>
  <!-- glittery crumb trail -->
  <g fill="#ffe27a"><circle cx="230" cy="380" r="4"/><circle cx="290" cy="395" r="3.6"/><circle cx="350" cy="385" r="4"/><circle cx="410" cy="400" r="3.4"/><circle cx="470" cy="392" r="4"/><circle cx="530" cy="405" r="3.6"/><circle cx="590" cy="398" r="4"/></g>
  <g fill="#fff7c8"><circle cx="260" cy="388" r="1.6"/><circle cx="380" cy="392" r="1.6"/><circle cx="500" cy="398" r="1.6"/></g>

  <!-- sleepy space walrus -->
  <g transform="translate(560,300)">
    <ellipse cx="60" cy="60" rx="80" ry="46" fill="#9c7fb0"/>
    <ellipse cx="60" cy="40" rx="40" ry="30" fill="#b095c2"/>
    <ellipse cx="48" cy="40" rx="6" ry="4" fill="#3a2e2e"/><ellipse cx="72" cy="40" rx="6" ry="4" fill="#3a2e2e"/>
    <path d="M44 40 q3 -4 8 0 M68 40 q3 -4 8 0" stroke="#3a2e2e" stroke-width="2" fill="none"/>
    <ellipse cx="60" cy="54" rx="16" ry="11" fill="#caa9d8"/>
    <path d="M52 58 q-3 22 -8 28 M68 58 q3 22 8 28" stroke="#fff" stroke-width="6" stroke-linecap="round" fill="none"/>
    <text x="40" y="6" font-size="20" fill="#cdbfe0">z</text><text x="24" y="-10" font-size="14" fill="#cdbfe0">z</text>
  </g>
  <!-- comet-cat -->
  <g transform="translate(120,160)">
    <path d="M0 30 q-70 6 -120 40" stroke="#7fd8e8" stroke-width="8" fill="none" opacity="0.5" stroke-linecap="round"/>
    <circle cx="20" cy="24" r="24" fill="#7fd8e8"/>
    <path d="M2 8 L-6 -14 L16 2 Z" fill="#7fd8e8"/><path d="M38 8 L46 -14 L24 2 Z" fill="#7fd8e8"/>
    <circle cx="12" cy="22" r="3.5" fill="#1b3a4a"/><circle cx="28" cy="22" r="3.5" fill="#1b3a4a"/>
    <path d="M20 28 l-3 3 l3 3 l3 -3 z" fill="#1b3a4a"/>
  </g>

  <!-- Pip sniffing along trail -->
  <g transform="translate(170,300) scale(0.92)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <ellipse cx="64" cy="142" rx="12" ry="9" fill="#F4733A"/><ellipse cx="96" cy="142" rx="12" ry="9" fill="#F4733A"/>
    <!-- head tilted down sniffing -->
    <g transform="rotate(18 80 70)">
      <circle cx="80" cy="56" r="40" fill="#F4733A"/>
      <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
      <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
      <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
      <g transform="rotate(26 120 4)"><path d="M120 4 q22 -6 34 8 q-20 10 -34 -2 z" fill="#6FBF73"/></g>
      <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
      <ellipse cx="80" cy="74" rx="6" ry="5" fill="#3A2E2E"/>
      <path d="M60 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
      <path d="M86 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>
  </g>
</svg>
