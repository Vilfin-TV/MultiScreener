<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Brave Pip and glowing Hoshi diving together into a magical glowing ocean full of bubbles">
  <defs>
    <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0e4a6e"/><stop offset="0.5" stop-color="#0b6a8c"/><stop offset="1" stop-color="#073b5a"/></linearGradient>
    <radialGradient id="hglow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#fff3c4" stop-opacity="0.9"/><stop offset="1" stop-color="#ffd75e" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#sea)"/>
  <!-- light rays -->
  <g fill="#bfe9ff" opacity="0.12"><polygon points="120,0 220,0 160,520 80,520"/><polygon points="420,0 520,0 480,520 360,520"/><polygon points="640,0 720,0 700,520 600,520"/></g>
  <!-- bubbles -->
  <g fill="#bfeaff" opacity="0.7"><circle cx="120" cy="120" r="8"/><circle cx="160" cy="200" r="5"/><circle cx="640" cy="150" r="9"/><circle cx="600" cy="240" r="5"/><circle cx="700" cy="320" r="7"/><circle cx="100" cy="360" r="6"/><circle cx="520" cy="420" r="5"/><circle cx="260" cy="440" r="7"/></g>
  <g fill="#fff" opacity="0.5"><circle cx="117" cy="116" r="2.4"/><circle cx="637" cy="146" r="2.6"/><circle cx="697" cy="316" r="2.2"/></g>
  <!-- diving pose: Pip head-down -->
  <g transform="translate(400,300) rotate(150) scale(1.0)">
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <ellipse cx="80" cy="112" rx="48" ry="36" fill="#F4733A"/><ellipse cx="80" cy="120" rx="28" ry="24" fill="#FFF1E0"/>
    <ellipse cx="50" cy="118" rx="11" ry="14" fill="#F4733A" transform="rotate(-30 50 118)"/>
    <ellipse cx="112" cy="118" rx="11" ry="14" fill="#F4733A" transform="rotate(30 112 118)"/>
    <circle cx="80" cy="56" r="38" fill="#F4733A"/>
    <path d="M46 56 q-10 14 2 24 q10 -6 14 -16 z" fill="#FFF1E0"/><path d="M114 56 q10 14 -2 24 q-10 -6 -14 -16 z" fill="#FFF1E0"/>
    <path d="M54 30 L46 -2 L74 22 Z" fill="#F4733A"/><path d="M106 30 L114 -2 L86 22 Z" fill="#F4733A"/>
    <path d="M64 62 q16 24 32 0 q-16 11 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="5.5" ry="4.5" fill="#3A2E2E"/>
    <path d="M62 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M84 52 q6 -6 14 0" stroke="#3A2E2E" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <!-- Hoshi diving with, leaving a glow trail -->
  <g transform="translate(300,210) scale(0.78)"><circle cx="0" cy="0" r="44" fill="url(#hglow)"/>
    <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
    <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    <circle cx="-15" cy="7" r="4" fill="#FF9DB0"/><circle cx="15" cy="7" r="4" fill="#FF9DB0"/>
    <path d="M-6 8 q6 6 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- seabed hint -->
  <path d="M0 500 C200 480 400 500 800 486 L800 520 L0 520 Z" fill="#063048" opacity="0.8"/>
</svg>
