<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 520" width="800" height="520" role="img" aria-label="Pip wearing a tiny detective hat with a magnifying glass and notebook in starry space beside a worried Hoshi">
  <defs>
    <linearGradient id="space" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#15103f"/><stop offset="1" stop-color="#341a5a"/></linearGradient>
    <radialGradient id="lens" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#dff4ff" stop-opacity="0.6"/><stop offset="1" stop-color="#bfe6ff" stop-opacity="0.15"/></radialGradient>
  </defs>
  <rect width="800" height="520" fill="url(#space)"/>
  <g fill="#fff"><circle cx="80" cy="70" r="1.8"/><circle cx="200" cy="130" r="1.3"/><circle cx="320" cy="60" r="1.6"/><circle cx="560" cy="90" r="1.6"/><circle cx="700" cy="150" r="1.6"/><circle cx="120" cy="300" r="1.4"/><circle cx="740" cy="320" r="1.5"/><circle cx="430" cy="430" r="1.5"/></g>
  <g fill="#ffe27a"><circle cx="640" cy="80" r="4"/><circle cx="150" cy="200" r="3.5"/><circle cx="720" cy="240" r="3.5"/><circle cx="500" cy="160" r="3"/></g>
  <!-- planet -->
  <g transform="translate(700,420)"><circle r="46" fill="#8a5fd6"/><ellipse rx="70" ry="16" fill="none" stroke="#d9c2f5" stroke-width="5" opacity="0.7" transform="rotate(-16)"/></g>

  <!-- Pip detective floating center -->
  <g transform="translate(250,250) scale(1.05)">
    <ellipse cx="80" cy="112" rx="50" ry="38" fill="#F4733A"/><ellipse cx="80" cy="120" rx="30" ry="26" fill="#FFF1E0"/>
    <path d="M40 120 C-16 112 -6 56 26 70 C20 96 30 113 50 117 Z" fill="#F4733A"/>
    <!-- right arm holding magnifier -->
    <ellipse cx="120" cy="96" rx="11" ry="14" fill="#F4733A" transform="rotate(35 120 96)"/>
    <circle cx="80" cy="56" r="40" fill="#F4733A"/>
    <path d="M44 56 q-10 14 2 26 q10 -6 14 -18 z" fill="#FFF1E0"/><path d="M116 56 q10 14 -2 26 q-10 -6 -14 -18 z" fill="#FFF1E0"/>
    <path d="M52 28 L44 -6 L74 20 Z" fill="#F4733A"/><path d="M108 28 L116 -6 L86 20 Z" fill="#F4733A"/>
    <path d="M55 24 L50 4 L68 20 Z" fill="#E85C3A"/><path d="M105 24 L110 4 L92 20 Z" fill="#E85C3A"/>
    <!-- deerstalker detective hat -->
    <path d="M44 30 q36 -26 72 0 q-6 8 -36 8 q-30 0 -36 -8 z" fill="#7a8a5a"/>
    <ellipse cx="80" cy="30" rx="40" ry="9" fill="#697a4c"/>
    <path d="M80 12 q-6 -10 0 -16 q6 6 0 16" fill="#8a9a68"/>
    <path d="M64 62 q16 26 32 0 q-16 12 -32 0 z" fill="#FFF1E0"/>
    <ellipse cx="80" cy="72" rx="6" ry="5" fill="#3A2E2E"/>
    <!-- determined eyes -->
    <ellipse cx="66" cy="52" rx="6" ry="7" fill="#3A2E2E"/><ellipse cx="94" cy="52" rx="6" ry="7" fill="#3A2E2E"/>
    <circle cx="68" cy="49" r="2" fill="#fff"/><circle cx="96" cy="49" r="2" fill="#fff"/>
    <path d="M58 40 q8 4 14 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M88 40 q8 4 14 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
  <!-- magnifying glass -->
  <g transform="translate(430,330)"><circle r="34" fill="url(#lens)" stroke="#c9883f" stroke-width="8"/><rect x="22" y="22" width="44" height="13" rx="6" fill="#a9743b" transform="rotate(45 22 22)"/></g>
  <!-- notebook -->
  <g transform="translate(150,360)"><rect width="54" height="40" rx="5" fill="#fdf4d8" transform="rotate(-12 0 0)"/><g stroke="#c9b98a" stroke-width="2"><line x1="6" y1="12" x2="44" y2="4"/><line x1="8" y1="22" x2="46" y2="14"/></g></g>
  <!-- worried Hoshi -->
  <g transform="translate(620,250) scale(0.7)"><circle cx="0" cy="0" r="42" fill="#ffe9a8" opacity="0.5"/>
    <path d="M0 -34 L10 -10 L36 -10 L15 6 L23 32 L0 16 L-23 32 L-15 6 L-36 -10 L-10 -10 Z" fill="#FFD75E"/>
    <ellipse cx="-9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/><ellipse cx="9" cy="-2" rx="4.5" ry="5.5" fill="#3A2E2E"/>
    <path d="M-6 12 q6 -5 12 0" stroke="#3A2E2E" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>
</svg>
